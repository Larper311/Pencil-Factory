<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Hoop Hustle · Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070f;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:min(100vw,calc(100vh*960/560));aspect-ratio:960/560;max-height:100%}
canvas{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 0 60px #000d,0 0 0 1px #ffffff12}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#03050ccc;border-radius:14px;padding:14px;backdrop-filter:blur(6px);transition:opacity .25s}
.card{background:linear-gradient(165deg,#1c2558 0%,#0c1028 100%);border:2px solid #ff9a2e;border-radius:20px;padding:24px 30px;max-width:640px;width:100%;max-height:96%;overflow:auto;text-align:center;box-shadow:0 0 50px #ff9a2e40,inset 0 1px 0 #ffffff18}
h1{margin:0 0 8px;font-size:clamp(30px,5.8vw,50px);color:#ff9a2e;letter-spacing:2px;text-shadow:0 3px 0 #7a3b00,0 0 24px #ff9a2e66}
p{margin:8px 0;color:#b4c0ff;font-size:clamp(13px,1.9vw,15.5px);line-height:1.45}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:13px;padding:12px 24px;margin:7px;color:#fff;background:linear-gradient(180deg,#ff8f2e,#e06a10);box-shadow:0 5px 0 #9b4500,0 8px 16px #0007;font-size:clamp(14px,2.1vw,17px);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b4500}
button.alt{background:linear-gradient(180deg,#4d7fff,#2a55d8);box-shadow:0 5px 0 #1a3488,0 8px 16px #0007}
button.green{background:linear-gradient(180deg,#3ddc7a,#1faa4e);box-shadow:0 5px 0 #0d6b2e,0 8px 16px #0007}
button:disabled{background:#3a3a3a;box-shadow:0 5px 0 #222;cursor:not-allowed;color:#777;filter:none}
.up{display:flex;align-items:center;gap:12px;background:#ffffff0a;border-radius:13px;padding:11px 14px;margin:8px 0;text-align:left;border:1px solid #ffffff0a}
.up .t{flex:1}.up b{font-size:15px;color:#fff}.up small{display:block;color:#8ea0ff;font-size:12.5px;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:5px}.pip{width:14px;height:6px;border-radius:3px;background:#2a2a3a}.pip.on{background:linear-gradient(90deg,#ffb23e,#ff8c2a)}
.money{font-size:26px;color:#6dff8c;font-weight:800;text-shadow:0 0 14px #6dff8c55}
.hint{font-size:12.5px;opacity:.7;margin-top:12px}
.stat{display:inline-block;background:#ffffff10;border-radius:8px;padding:4px 10px;margin:3px;font-size:13px}
</style>
</head>
<body>
<div id="wrap"><div id="box"><canvas id="c" width="960" height="560"></canvas><div id="ov"></div></div></div>
<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d'), ov = document.getElementById('ov');
const W = 960, H = 560, FLOOR = 498, BR = 13.5, GRAV = 0.37;

// ===================== SAVE =====================
let S = { money: 0, best: 0, total: 0, games: 0, up: { str:0, spd:0, acc:0, mul:0, run:0, luck:0 } };
try {
  const d = JSON.parse(localStorage.getItem('hoophustle_pro') || 'null');
  if (d) { S = Object.assign(S, d); S.up = Object.assign({str:0,spd:0,acc:0,mul:0,run:0,luck:0}, d.up); }
} catch(e){}
function save(){ try{ localStorage.setItem('hoophustle_pro', JSON.stringify(S)); }catch(e){} }

const UPG = {
  str:  { n:'💪 Strength',  d:'Harder throws — reach deep money range', base:48 },
  spd:  { n:'⚡ Reload',    d:'Faster ball return + more time per make', base:42 },
  acc:  { n:'🎯 Accuracy',  d:'Longer aim arc + wider rim', base:52 },
  mul:  { n:'💰 Cash Boost',d:'+20% coins on every basket', base:68 },
  run:  { n:'🏃 Hustle',    d:'Sprint faster between spots', base:38 },
  luck: { n:'🍀 Clutch',    d:'Higher chance of money-ball & big swishes', base:55 }
};
const MAXL = 12;
const cost = k => Math.round(UPG[k].base * Math.pow(1.48, S.up[k]));

// ===================== AUDIO =====================
let AC = null;
function snd(f, t=0.08, type='sine', v=0.09, sl=0){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, AC.currentTime);
    if(sl) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+sl), AC.currentTime+t);
    gn.gain.setValueAtTime(v, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+t);
    o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime+t);
  }catch(e){}
}
function chord(notes, t=0.18){ notes.forEach((n,i)=>setTimeout(()=>snd(n,t,'sine',0.06), i*30)); }

// ===================== STATE =====================
let state = 'menu', time = 0, frame = 0, shake = 0, hitstop = 0, slowmo = 0;
let round = { score:0, earned:0, baskets:0, shots:0, streak:0, bestStreak:0, deep:0 };
let b = { x:0, y:0, vx:0, vy:0, live:false, rim:false, board:false, t:0, rot:0, scored:false, resolved:false, trail:[] };
let px = 260, targetPx = 260, facing = 1, runAnim = 0;
let wind = 0, wait = 0, net = 0, moneyBall = false, nextMoney = 4;
let hoop = { bx:780, by:270, w:56 };
let parts = [], floats = [], sparks = [], aim = null;
let keys = { left:false, right:false };
let camX = 0, camY = 0;

const maxV   = () => 12.8 + S.up.str * 1.28;
const rimW   = () => 53 + S.up.acc * 2.9;
const moveSpd= () => 4.6 + S.up.run * 0.9;
const stage  = () => Math.floor(round.baskets / 3);
const distTo = () => Math.max(50, hoop.bx - px);

function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

function payout(d){
  const ft = d / 9.2;
  let base = 7 + ft * 1.55 + stage() * 2.1;
  if (moneyBall) base *= 2.4;
  return Math.round(base);
}

// ===================== FLOW =====================
function newShot(){
  b = { x:px+18, y:FLOOR-90, vx:0, vy:0, live:false, rim:false, board:false, t:0, rot:0, scored:false, resolved:false, trail:[] };
  const st = stage();
  wind = st >= 2 ? rand(-1,1) * Math.min(0.06, 0.013 + st*0.007) : 0;
  moneyBall = (round.baskets > 0 && round.baskets % nextMoney === 0);
  if (moneyBall) nextMoney = 3 + Math.floor(Math.random()*3);
  state = 'ready';
}

function startRound(){
  round = { score:0, earned:0, baskets:0, shots:0, streak:0, bestStreak:0, deep:0 };
  time = 44; hoop.bx = 780; hoop.by = 270; hoop.w = rimW();
  parts = []; floats = []; sparks = [];
  px = 260; targetPx = 260; nextMoney = 4; moneyBall = false;
  ov.style.display = 'none';
  newShot();
  state = 'ready';
  snd(440,0.1,'triangle',0.06);
}

function endRound(){
  state = 'over';
  S.games++;
  if (round.score > S.best) S.best = round.score;
  S.total += round.baskets;
  save();
  ov.style.display = 'flex';
  const deepBonus = round.deep > 0 ? `<p>Deep makes: <b>${round.deep}</b></p>` : '';
  ov.innerHTML = `<div class="card">
    <h1>TIME'S UP</h1>
    <p style="font-size:21px">Baskets <b>${round.baskets}</b> · Shots ${round.shots}</p>
    <p>Best streak <b>${round.bestStreak}</b></p>
    ${deepBonus}
    <p class="money">+$${round.earned}</p>
    <p>Balance $${S.money} · Best score ${S.best}</p>
    <button id="again">▶ Play Again</button>
    <button class="alt" id="shop">🛒 Shop</button>
  </div>`;
  document.getElementById('again').onclick = startRound;
  document.getElementById('shop').onclick = () => showShop('over');
}

function showMenu(){
  state = 'menu';
  ov.style.display = 'flex';
  ov.innerHTML = `<div class="card">
    <h1>🏀 HOOP HUSTLE</h1>
    <p><b>A / D</b> or edges to run · <b>Drag back</b> to slingshot shoot</p>
    <p>Farther = bigger cash. Streaks, swishes & money-balls multiply hard.<br>
    Wind and moving rims ramp up as you cook.</p>
    <p class="money">$${S.money}</p>
    <div>
      <span class="stat">🏆 Best ${S.best}</span>
      <span class="stat">🏀 ${S.total} lifetime</span>
      <span class="stat">🎮 ${S.games} games</span>
    </div>
    <button id="play" class="green">▶ PLAY</button>
    <button class="alt" id="shop">🛒 Upgrade Shop</button>
    <p class="hint">Pro tip: sit deep for huge payouts when the rim is still</p>
  </div>`;
  document.getElementById('play').onclick = startRound;
  document.getElementById('shop').onclick = () => showShop('menu');
}

function showShop(from){
  let h = `<div class="card"><h1>🛒 SHOP</h1><p class="money">$${S.money}</p>`;
  for (const k in UPG){
    const l = S.up[k], c = cost(k), mx = l >= MAXL;
    h += `<div class="up"><div class="t"><b>${UPG[k].n} · Lv ${l}</b><small>${UPG[k].d}</small>
    <div class="pips">${Array.from({length:MAXL},(_,i)=>`<div class="pip ${i<l?'on':''}"></div>`).join('')}</div></div>
    <button data-k="${k}" ${mx||S.money<c?'disabled':''}>${mx?'MAX':'$'+c}</button></div>`;
  }
  h += `<button class="alt" id="back">⬅ Back</button></div>`;
  ov.innerHTML = h; ov.style.display = 'flex';
  ov.querySelectorAll('button[data-k]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.k, c = cost(k);
      if (S.money >= c && S.up[k] < MAXL){
        S.money -= c; S.up[k]++; save();
        snd(720,0.12,'square',0.07,280);
        showShop(from);
      }
    };
  });
  document.getElementById('back').onclick = () => from === 'over' ? endRound2() : showMenu();
}

function endRound2(){
  ov.innerHTML = `<div class="card"><h1>Round Over</h1><p class="money">$${S.money}</p>
  <button id="again">▶ Play Again</button><button class="alt" id="shop">🛒 Shop</button></div>`;
  document.getElementById('again').onclick = startRound;
  document.getElementById('shop').onclick = () => showShop('over');
}

// ===================== INPUT =====================
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'ready') return;
  cv.setPointerCapture(e.pointerId);
  const p = pos(e);
  // edge zones for mobile move
  if (p.x < W*0.18){ keys.left = true; return; }
  if (p.x > W*0.82){ keys.right = true; return; }
  aim = { sx:p.x, sy:p.y, cx:p.x, cy:p.y };
});
cv.addEventListener('pointermove', e => { if (aim){ const p=pos(e); aim.cx=p.x; aim.cy=p.y; } });
cv.addEventListener('pointerup', e => {
  keys.left = keys.right = false;
  if (!aim) return;
  const v = aimVec();
  aim = null;
  if (v.len > 14 && v.vx > 0.12) shoot(v);
});
window.addEventListener('keydown', e => {
  if (e.code==='KeyA'||e.code==='ArrowLeft') keys.left = true;
  if (e.code==='KeyD'||e.code==='ArrowRight') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.code==='KeyA'||e.code==='ArrowLeft') keys.left = false;
  if (e.code==='KeyD'||e.code==='ArrowRight') keys.right = false;
});

function aimVec(){
  const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy;
  const l = Math.hypot(dx,dy), L = Math.min(l,160), p = L/160;
  const sp = p * maxV();
  return { vx: l? dx/l*sp : 0, vy: l? dy/l*sp : 0, len:l, p };
}
function shoot(v){
  b.vx = v.vx; b.vy = v.vy; b.live = true; b.trail = [];
  state = 'fly'; round.shots++;
  snd(260,0.1,'triangle',0.08,160);
}

// ===================== PHYSICS =====================
function hitPt(x,y,r){
  const dx=b.x-x, dy=b.y-y, d=Math.hypot(dx,dy), m=BR+r;
  if (d < m && d > 0.001){
    const nx=dx/d, ny=dy/d;
    b.x = x+nx*m; b.y = y+ny*m;
    const dt = b.vx*nx + b.vy*ny;
    if (dt < 0){
      b.vx -= 1.65*dt*nx; b.vy -= 1.65*dt*ny;
      b.rim = true;
      snd(160+Math.random()*50,0.07,'square',0.05);
      shake = 4;
      // sparks on rim
      for(let i=0;i<6;i++) sparks.push({x:b.x,y:b.y,vx:rand(-2,2),vy:rand(-3,0),l:12+rand(0,10),c:'#ffcc66'});
    }
  }
}

function resolveMiss(){
  if (b.resolved) return;
  b.resolved = true; round.streak = 0;
  floats.push({x:clamp(b.x,80,W-80), y:Math.min(b.y,FLOOR-60), t:'MISS', c:'#ff5c5c', l:46, s:22});
  wait = 15 + Math.max(0, 24 - S.up.spd*2.6);
  state = 'wait';
  snd(90,0.15,'sawtooth',0.04);
}

function score(){
  b.scored = true; b.resolved = true;
  round.baskets++; round.streak++;
  round.bestStreak = Math.max(round.bestStreak, round.streak);
  const d = distTo();
  const swish = !b.rim && !b.board;
  const sm = 1 + Math.min(round.streak-1, 14) * 0.135;
  let pay = Math.round( (payout(d) + (swish?11:0)) * sm * (1 + S.up.mul*0.20) );
  // clutch luck
  if (S.up.luck > 0 && Math.random() < S.up.luck*0.018) { pay = Math.round(pay*1.5); floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-90,t:'CLUTCH!',c:'#ff66ff',l:50,s:20}); }
  if (d > 340){ round.deep++; pay = Math.round(pay*1.15); }
  S.money += pay; round.earned += pay; round.score += pay;
  const addT = 1.4 + S.up.spd*0.36; time = Math.min(time + addT, 99);
  net = 1.2; shake = swish ? 3 : 6;
  if (swish || d > 360 || moneyBall){ hitstop = 4; slowmo = 8; }
  // audio
  if (swish) chord([880,1100,1320],0.2);
  else snd(620,0.18,'sine',0.09,220);
  // text
  let label = (moneyBall?'💰 ':'') + (swish?'SWISH! ':'') + '+$'+pay;
  if (d > 360) label += ' DEEP';
  floats.push({x:hoop.bx+hoop.w/2, y:hoop.by-36, t:label, c: moneyBall?'#ffd700':(swish?'#7dff8a':'#ffd24a'), l:78, s:26});
  if (round.streak >= 2) floats.push({x:hoop.bx+hoop.w/2, y:hoop.by-68, t:'🔥 x'+round.streak, c:'#ff9a2e', l:55, s:20});
  // confetti
  const cols = moneyBall ? ['#ffd700','#fff','#ff9a2e'] : ['#ff6b2e','#ffd24a','#fff','#7dff8a'];
  for(let i=0;i<36;i++){
    parts.push({x:hoop.bx+hoop.w/2, y:hoop.by+6, vx:rand(-4.5,4.5), vy:rand(-6.5,1.5), l:rand(30,65), c:cols[i%cols.length], s:rand(3,6)});
  }
  wait = 18 + Math.max(0, 24 - S.up.spd*2.6);
  state = 'wait';
  moneyBall = false;
}

function step(){
  if (hitstop > 0){ hitstop--; return; }
  const dt = slowmo > 0 ? 0.55 : 1;
  if (slowmo > 0) slowmo--;

  frame++;
  // moving hoop
  const st = stage();
  if (state !== 'menu' && state !== 'over'){
    const amp = st >= 3 ? Math.min(120, 30+(st-3)*16) : 0;
    const ax  = st >= 6 ? Math.min(75, (st-5)*12) : 0;
    hoop.by = 270 + Math.sin(frame*0.0165*(1+st*0.045)) * amp;
    hoop.bx = 780 - Math.abs(Math.sin(frame*0.010)) * ax;
    hoop.w = rimW();
  }

  if (state === 'ready' || state === 'fly' || state === 'wait'){
    time -= (1/60)*dt;
    if (time <= 0){ time=0; endRound(); return; }
  }

  // movement
  if (state === 'ready' && !aim){
    let spd = moveSpd();
    if (keys.left){ targetPx -= spd; facing = -1; }
    if (keys.right){ targetPx += spd; facing = 1; }
    targetPx = clamp(targetPx, 70, hoop.bx - 170);
    px += (targetPx - px) * 0.25;
    if (Math.abs(targetPx - px) > 1.5) runAnim += 0.35; else runAnim *= 0.8;
  }

  if (state === 'fly' || state === 'wait'){
    if (b.live){
      const py = b.y;
      b.t++;
      b.vx += wind * dt; b.vy += GRAV * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.rot += b.vx * 0.05;
      // trail
      if (frame % 2 === 0) b.trail.push({x:b.x, y:b.y, l:14});
      if (b.trail.length > 12) b.trail.shift();
      b.trail.forEach(t => t.l--);

      const fx = hoop.bx, bx2 = hoop.bx + hoop.w;
      hitPt(fx, hoop.by, 4); hitPt(bx2, hoop.by, 4);
      // backboard
      const bbx = bx2 + 8;
      if (b.x+BR > bbx && b.x-BR < bbx+12 && b.y > hoop.by-110 && b.y < hoop.by+18 && b.vx > 0){
        b.x = bbx - BR; b.vx *= -0.5; b.board = true;
        snd(130,0.07,'square',0.055); shake = 3.5;
      }
      // score
      if (!b.scored && py < hoop.by && b.y >= hoop.by && b.vy > 0 && b.x > fx+3 && b.x < bx2-3) score();
      // floor
      if (b.y + BR > FLOOR){
        b.y = FLOOR - BR; b.vy *= -0.55; b.vx *= 0.88;
        if (Math.abs(b.vy) < 1.1) b.vy = 0;
        if (Math.abs(b.vy) > 1.6) snd(100,0.05,'sine',0.05);
      }
      if (!b.resolved && (b.x > W+80 || b.x < -80 || b.t > 190 || (b.y >= FLOOR-BR && b.t > 30 && Math.abs(b.vy)<1.6))) resolveMiss();
    }
    if (state === 'wait'){ wait -= dt; if (wait <= 0) newShot(); }
  }

  // particles
  for (const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.2*dt; p.l-=dt; }
  parts = parts.filter(p => p.l > 0);
  for (const f of floats){ f.y -= 0.9*dt; f.l -= dt; }
  floats = floats.filter(f => f.l > 0);
  for (const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.15; s.l--; }
  sparks = sparks.filter(s => s.l > 0);
  net *= 0.91; shake *= 0.83;
  // soft camera
  camX += ( (px - 400)*0.08 - camX ) * 0.08;
  camY += ( (hoop.by - 280)*0.04 - camY ) * 0.06;
}

// ===================== DRAW =====================
function draw(){
  g.save();
  if (shake > 0.3) g.translate(rand(-shake,shake), rand(-shake,shake));
  g.translate(-camX*0.6, -camY*0.5);

  // sky
  const sk = g.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#0a0e2a'); sk.addColorStop(0.5,'#1e1848'); sk.addColorStop(1,'#5c2d48');
  g.fillStyle = sk; g.fillRect(-40,-40,W+80,H+80);

  // crowd (parallax)
  for (let i=0;i<90;i++){
    const cx = (i*47 + frame*0.12) % (W+60) - 30;
    const cy = 295 + ((i*31)%125);
    const bob = Math.sin(frame*0.04 + i)*2;
    g.fillStyle = `hsl(${(i*37)%360},40%,${18+(i%5)*3}%)`;
    g.beginPath(); g.arc(cx, cy+bob, 8+i%3, 0, 7); g.fill();
  }
  // arena lights
  g.fillStyle = '#ffffff14';
  for(let i=0;i<7;i++){ g.beginPath(); g.arc(100+i*120, 40+(i%2)*14, 3,0,7); g.fill(); }

  // floor
  const fl = g.createLinearGradient(0,FLOOR,0,H);
  fl.addColorStop(0,'#e8a04a'); fl.addColorStop(1,'#8a4c1c');
  g.fillStyle = fl; g.fillRect(-20,FLOOR,W+40,H-FLOOR+20);
  // floor shine
  g.fillStyle = '#ffffff08';
  g.fillRect(-20,FLOOR,W+40,18);
  // court lines
  g.strokeStyle = '#ffffff38'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-20,FLOOR+2); g.lineTo(W+20,FLOOR+2); g.stroke();
  g.beginPath(); g.arc(hoop.bx-40, H+55, 200, Math.PI*1.08, Math.PI*1.92); g.stroke();
  // key
  g.strokeStyle = '#ffffff22'; g.lineWidth = 2;
  g.strokeRect(hoop.bx-210, FLOOR-8, 180, 8);

  // hoop pole + backboard
  const hx = hoop.bx, hy = hoop.by, w = hoop.w;
  g.fillStyle = '#2a2a2a';
  g.fillRect(hx+w+17, hy-30, 8, FLOOR-hy+30);
  // backboard
  const bg = g.createLinearGradient(hx+w+8, hy-115, hx+w+22, hy+10);
  bg.addColorStop(0,'#f0f4ff'); bg.addColorStop(1,'#c8d0e8');
  g.fillStyle = bg; g.strokeStyle = '#7a88b8'; g.lineWidth = 3;
  g.fillRect(hx+w+9, hy-112, 14, 124); g.strokeRect(hx+w+9, hy-112, 14, 124);
  // square on board
  g.strokeStyle = '#ff5a1f88'; g.lineWidth = 2;
  g.strokeRect(hx+w-18, hy-55, 28, 22);

  // rim
  g.strokeStyle = moneyBall ? '#ffd700' : '#ff5a1f';
  g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(hx,hy); g.lineTo(hx+w,hy); g.stroke();
  // net
  g.strokeStyle = '#ffffffcc'; g.lineWidth = 1.5;
  const sw = net * 9;
  for (let i=0;i<=8;i++){
    const t = i/8;
    g.beginPath(); g.moveTo(hx+w*t, hy);
    g.lineTo(hx+w*(0.16+0.68*t) + Math.sin(frame*0.4+i)*sw, hy+46); g.stroke();
  }
  for (let j=1;j<4;j++){
    const yy = hy + j*11.5;
    g.beginPath(); g.moveTo(hx+w*0.035*j, yy); g.lineTo(hx+w-w*0.035*j, yy); g.stroke();
  }

  // money ball glow on rim
  if (moneyBall){
    g.strokeStyle = '#ffd70055'; g.lineWidth = 14;
    g.beginPath(); g.moveTo(hx-4,hy); g.lineTo(hx+w+4,hy); g.stroke();
  }

  // player
  drawPlayer(px, FLOOR);

  // aim guide
  if (aim && state === 'ready'){
    const v = aimVec();
    let x=b.x, y=b.y, vx=v.vx, vy=v.vy;
    const n = 9 + S.up.acc*3.2;
    for (let i=0;i<n*4;i++){
      vx += wind; vy += GRAV; x += vx; y += vy;
      if (i%4===3){
        const a = 1 - i/(n*4);
        g.fillStyle = `rgba(255,255,255,${a*0.9})`;
        g.beginPath(); g.arc(x,y,4.5-i/(n*4)*2.4,0,7); g.fill();
      }
    }
    // power bar
    g.fillStyle = '#000a'; g.fillRect(px-52, FLOOR+18, 104, 12);
    const hue = 130 - v.p*130;
    g.fillStyle = `hsl(${hue},95%,55%)`;
    g.fillRect(px-52, FLOOR+18, 104*v.p, 12);
    g.strokeStyle = '#ffffff44'; g.lineWidth=1; g.strokeRect(px-52,FLOOR+18,104,12);
  }

  // ball trail
  if (b.trail){
    for (let i=0;i<b.trail.length;i++){
      const t = b.trail[i];
      if (t.l<=0) continue;
      g.globalAlpha = t.l/16 * 0.5;
      g.fillStyle = moneyBall ? '#ffd700' : '#ff9a2e';
      g.beginPath(); g.arc(t.x, t.y, 5*(t.l/14), 0,7); g.fill();
    }
    g.globalAlpha = 1;
  }

  // ball
  if (state !== 'menu') drawBall(b.x, b.y, b.rot);

  // particles
  for (const p of parts){
    g.globalAlpha = Math.min(1, p.l/30);
    g.fillStyle = p.c;
    g.fillRect(p.x - (p.s||4)/2, p.y-(p.s||4)/2, p.s||4, p.s||4);
  }
  g.globalAlpha = 1;
  for (const s of sparks){
    g.globalAlpha = s.l/18;
    g.fillStyle = s.c;
    g.fillRect(s.x-1.5,s.y-1.5,3,3);
  }
  g.globalAlpha = 1;

  // floating text
  g.textAlign = 'center';
  for (const f of floats){
    g.globalAlpha = Math.min(1, f.l/22);
    g.font = `bold ${f.s||22}px Segoe UI`;
    g.fillStyle = '#000a'; g.fillText(f.t, f.x+2, f.y+2);
    g.fillStyle = f.c; g.fillText(f.t, f.x, f.y);
  }
  g.globalAlpha = 1;
  g.restore();

  // ========== HUD ==========
  // left
  g.textAlign = 'left'; g.font = 'bold 20px Segoe UI';
  g.fillStyle = '#fff'; g.fillText('⏱ '+time.toFixed(1)+'s', 16, 30);
  g.fillStyle = '#6dff8c'; g.fillText('$'+S.money, 16, 55);
  g.fillStyle = '#ffd24a'; g.fillText('🏀 '+round.baskets, 16, 80);

  // right
  g.textAlign = 'right';
  if (round.streak > 1){
    g.fillStyle = '#ff9a2e'; g.font = 'bold 20px Segoe UI';
    g.fillText('🔥 x'+round.streak, W-16, 30);
  }
  g.fillStyle = '#c4ceff'; g.font = 'bold 14px Segoe UI';
  const d = distTo(), ft = Math.round(d/9.2);
  g.fillText(ft+' ft  ·  $'+payout(d)+' base  ·  Lvl '+(stage()+1), W-16, 54);
  if (Math.abs(wind) > 0.003){
    const a = Math.min(1, Math.abs(wind)/0.055);
    g.fillStyle = '#8ef'; g.fillText('Wind '+(wind>0?'→':'←').repeat(1+Math.round(a*3)), W-16, 74);
  }
  if (moneyBall){
    g.fillStyle = '#ffd700'; g.font = 'bold 16px Segoe UI';
    g.fillText('💰 MONEY BALL', W-16, 96);
  }

  // bottom hints
  if (state === 'ready' && !aim && round.shots < 2){
    g.textAlign = 'center'; g.fillStyle = '#ffffffbb'; g.font = 'bold 16px Segoe UI';
    g.fillText('A / D or edges to move   ·   Drag back to shoot', W/2, H-20);
  }
  // live payout under player
  if (state === 'ready'){
    g.textAlign = 'center'; g.font = 'bold 13px Segoe UI';
    g.fillStyle = moneyBall ? '#ffd700' : '#6dff8caa';
    g.fillText((moneyBall?'💰 ':'')+'+$'+payout(d), px - camX*0.6, FLOOR+40);
  }
}

function drawBall(x,y,r){
  g.save(); g.translate(x,y); g.rotate(r);
  // glow when money
  if (moneyBall){
    g.fillStyle = '#ffd70033';
    g.beginPath(); g.arc(0,0,BR+8,0,7); g.fill();
  }
  const gr = g.createRadialGradient(-5,-5,2,0,0,BR);
  gr.addColorStop(0, moneyBall ? '#ffe066' : '#ffb25c');
  gr.addColorStop(1, moneyBall ? '#c9a000' : '#c24a0c');
  g.fillStyle = gr;
  g.beginPath(); g.arc(0,0,BR,0,7); g.fill();
  g.strokeStyle = '#3a1600'; g.lineWidth = 1.5; g.stroke();
  // seams
  g.beginPath(); g.moveTo(-BR,0); g.lineTo(BR,0); g.moveTo(0,-BR); g.lineTo(0,BR);
  g.arc(-BR*1.05,0,BR*0.88,-0.85,0.85);
  g.moveTo(BR*0.15,0); g.arc(BR*1.05,0,BR*0.88,Math.PI-0.85,Math.PI+0.85);
  g.stroke();
  g.restore();
}

function drawPlayer(x,y){
  let pull = 0;
  if (aim && state==='ready') pull = aimVec().p;
  const shot = (state==='fly' && b.t < 12) ? 1 - b.t/12 : 0;
  const legSwing = Math.sin(runAnim) * 11 * (Math.abs(targetPx-px)>2 ? 1 : 0);

  // shadow
  g.fillStyle = '#0004';
  g.beginPath(); g.ellipse(x, y+2, 18, 5, 0, 0, 7); g.fill();

  // head
  g.fillStyle = '#f0c9a0';
  g.beginPath(); g.arc(x, y-104, 13, 0, 7); g.fill();
  // body
  g.strokeStyle = '#e33a2a'; g.lineWidth = 15; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y-90); g.lineTo(x, y-48); g.stroke();
  // legs
  g.strokeStyle = '#f0c9a0'; g.lineWidth = 7;
  g.beginPath();
  g.moveTo(x, y-46); g.lineTo(x - 12 - pull*4 + legSwing, y);
  g.moveTo(x, y-46); g.lineTo(x + 12 + pull*4 - legSwing, y);
  g.stroke();
  // arms
  const hx = x + 17*facing, hy = y - 90 + (1-shot)*2 - shot*15;
  g.beginPath();
  g.moveTo(x, y-82);
  g.lineTo(hx - 10*facing + shot*6*facing, hy + 14 - shot*16);
  g.lineTo(hx, hy);
  g.stroke();
  // hold ball
  if (state === 'ready'){
    b.x = x + 17; b.y = FLOOR - 90 - pull*8;
  }
}

// ===================== LOOP =====================
let last = performance.now(), acc = 0;
function loop(t){
  acc += Math.min(80, t-last); last = t;
  while (acc >= 1000/60){
    if (state !== 'menu' && state !== 'over') step();
    else {
      frame++;
      for (const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.l--; }
      parts = parts.filter(p=>p.l>0);
    }
    acc -= 1000/60;
  }
  draw();
  requestAnimationFrame(loop);
}

// boot
hoop.bx = 780; hoop.by = 270;
b = { x:260, y:FLOOR-90, vx:0, vy:0, rot:0, trail:[] };
showMenu();
requestAnimationFrame(loop);
})();
</script>
