<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Space Map</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#dbe4ff;font:12px system-ui,sans-serif}
canvas{position:fixed;inset:0;touch-action:none;cursor:grab}

</style></head><body>
<canvas id="c"></canvas><div id="ts"></div>
<div class="p" id="top"><b style="color:#9fc0ff;font-size:14px">🌌 DEEP SPACE</b><span id="dt"></span><span id="cr" class="ok"></span><button id="pp">⏸</button>
<select id="wp"><option value="1">1 d/s<option value="10" selected>10 d/s<option value="100">100 d/s<option value="1000">1k d/s<option value="10000">10k d/s</select>|
<button onclick="go(0,0,260)">Inner</button><button onclick="go(0,0,10)">Outer</button><button onclick="go(0,0,.004)">Oort</button><button onclick="goStar()">Proxima</button><button onclick="go(0,0,2e-6)">Neighbourhood</button><button onclick="go(0,0,2e-9)">Galaxy</button>
<button id="rl">📏 Ruler</button><button id="lb">🏷 Labels</button><label><input type="checkbox" id="sbx"> sandbox</label></div>
<div class="p" id="pn"><b>🚀 Launch from Earth</b><div id="rt"></div>
Power <b id="pv"></b><input type="range" id="pw" min="1" max="100" value="100">
Aim <b id="av"></b>° <input type="range" id="an" min="0" max="360" step=".05" value="0"><small class="dim">Right-click map = aim there</small><br>

<button id="aa">🎯 Auto-aim</button><button id="fw">🔭 Find window</button><button id="sw" disabled>⏩ Skip to window</button>
<div id="pr" style="margin:6px 0;line-height:1.5"></div><button id="ln" style="width:100%;background:#1f9a62;padding:8px">🚀 LAUNCH</button>
<p class="dim">Slingshot: aim so the cyan path bends past Jupiter/Saturn — gravity is simulated for all 8 planets. Δv is the excess speed after leaving Earth.</p></div>
<div class="p" id="inf"></div><div id="sc"></div>
<script>
const $=i=>document.getElementById(i),F=(x,n=2)=>(+x).toFixed(n),D=Math.PI/180,T2=6.2832,LY=63241.08,AUKM=1.495978707e8,KMS=86400/AUKM,CK=299792.458,GM=2.959122e-4,MF=2.2297e-15;
const fd=au=>{if(au<.02){const k=au*AUKM;return k<1e4?F(k,0)+' km':F(k/1e6,2)+' M km'}return au<5000?F(au,au<10?3:au<1000?1:0)+' AU':F(au/LY,au/LY<10?3:au/LY<1e4?1:0)+' ly'};
const ft=s=>s<90?F(s,0)+' s':s<5400?F(s/60,1)+' min':s<172800?F(s/3600,1)+' h':s<6e7?F(s/86400,1)+' d':F(s/31557600,s<3e9?1:0)+' yr';
const fy=d=>d<2?F(d*24,1)+' h':d<400?F(d,0)+' d':F(d/365.256,d<36525?1:0)+' yr';
const ds=d=>new Date(Date.UTC(2000,0,1,12)+d*864e5).toISOString().slice(0,10);
let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;
/* ---------- bodies ---------- */
const B=[];
[['Mercury',.3871,87.97,252.25,22032,2440,'#b9a99a',3],['Venus',.7233,224.7,181.98,324859,6052,'#f2d58a',4.5],['Earth',1,365.256,100.46,398600,6371,'#6fb3ff',4.5],['Mars',1.5237,686.98,355.45,42828,3390,'#ef7d57',3.5],['Jupiter',5.2029,4332.59,34.4,126686534,69911,'#e3c08f',8],['Saturn',9.5367,10759.22,49.94,37931187,58232,'#ecd9a0',7],['Uranus',19.189,30688.5,313.23,5793939,25362,'#9be3e8',5.5],['Neptune',30.07,60182,304.88,6836529,24622,'#6c8cff',5.5],['Pluto',39.48,90560,238.93,0,1188,'#f0e3d3',3],['Ceres',2.767,1681.6,249.9,0,470,'#cfcac2',2.5],['Eris',67.7,203500,204,0,1163,'#e8e8f0',3],['Sedna',506,4164000,311,0,500,'#e07a5a',3]]
.forEach(a=>B.push({n:a[0],a:a[1],P:a[2],L:a[3],mu:a[4]*MF,rad:a[5]/AUKM,col:a[6],vr:a[7],k:'p',thr:Math.max(.02,a[1]*.004)}));
const MP=[0,1,2,3,4,5,6,7],NB=12;
const star=(n,ly,an,col,k)=>{const r=ly*LY;B.push({n,a:r,x:r*Math.cos(an*D),y:r*Math.sin(an*D),col,vr:k=='s'?5:4,k,thr:k=='s'?r*.01:0,st:1})};
star('Proxima Centauri',4.246,203,'#ff9a6a','s');star('Alpha Centauri A/B',4.37,199.5,'#ffe9a0','s');star("Barnard's Star",5.96,95,'#ff8a6a','s');star('Wolf 359',7.86,160,'#ff7a5a','s');star('Sirius',8.6,285,'#cfe6ff','s');star('Epsilon Eridani',10.5,330,'#ffc98a','s');star('Tau Ceti',11.9,35,'#ffe6a8','s');
star('Vega',25,50,'#cfe0ff','f');star('Arcturus',36.7,230,'#ffc98a','f');star('Capella',42.9,120,'#ffe6a8','f');star('Pleiades',444,160,'#9fc0ff','f');star('Betelgeuse',548,5,'#ff7a5a','f');star('Orion Nebula',1344,200,'#ff8ad0','f');star('Galactic Centre',26000,265,'#ffd37a','f');star('Andromeda Galaxy',2.5e6,40,'#c49bff','f');
['Nyx-1','Ravel','Halcyon','Obsidian','Tithonus','Vesper','Cassiel','Maelstrom','Lethe','Aurelia','Brume','Kestrel'].forEach(n=>{const r=Math.exp(Math.log(2500)+rn()*Math.log(40)),an=rn()*360;B.push({n:'Oort '+n,a:r,x:r*Math.cos(an*D),y:r*Math.sin(an*D),col:'#9fd0ff',vr:3,k:'o',thr:r*.01,st:1})});
B.forEach(b=>b.rew=b.thr>0?Math.round(10+30*Math.log10(1+b.a)):0);
const TI=B.map((b,i)=>b.thr>0&&i!=2?i:-1).filter(i=>i>=0);
let TX,TY;const tp=(i,d)=>{const b=B[i];if(b.st){TX=b.x;TY=b.y}else{const a=(b.L+360*d/b.P)*D;TX=b.a*Math.cos(a);TY=b.a*Math.sin(a)}};
const PX=[],PY=[],setP=d=>{for(const i of MP){const b=B[i],a=(b.L+360*d/b.P)*D;PX[i]=b.a*Math.cos(a);PY[i]=b.a*Math.sin(a)}};
const OO=[],AB=[],KB=[];for(let i=0;i<5000;i++)OO.push([Math.exp(Math.log(2000)+rn()*Math.log(50)),rn()*T2,rn()<.1?2:1,.3+rn()*.6]);
for(let i=0;i<1500;i++)AB.push([2.1+rn()*1.3,rn()*T2,1,.3+rn()*.6]);for(let i=0;i<1500;i++)KB.push([30+rn()*20,rn()*T2,1,.3+rn()*.6]);
const SS=[];for(let i=0;i<260;i++)SS.push([rn(),rn(),rn()*1.5+.4]);
/* ---------- rockets ---------- */
const RK=[{n:'Chemical stage',dv:9,cost:3,unl:0,h:4000,col:'#ffb347'},{n:'Ion drive',dv:22,cost:6,unl:40,h:9000,col:'#7ad1ff'},{n:'Nuclear thermal',dv:40,cost:12,unl:120,h:12000,col:'#9bff9b'},{n:'Fusion torch',dv:180,cost:30,unl:300,h:30000,col:'#ff9bff'},{n:'Starshot light-sail (0.2c)',dv:CK*.2,cost:80,unl:600,h:25000,col:'#ffffff'}];
let S;try{S=JSON.parse(localStorage.getItem('dsm'))}catch(e){}S=S&&S.unl?S:{d:10958,cr:60,unl:[1],vis:{},sb:0};
let ty=0,SEL=null,run=1,speed=10,dirty=1,labels=1,ruler=0,RU=[],R=[],rid=0,WIN=null,PV=null,fr=0,lt=0,LBK=new Set();
const cam={x:0,y:0,s:260,tx:0,ty:0,ts:260,fol:null};
/* ---------- physics (AU, days) ---------- */
let AX,AY,NR,HIT;
function acc(x,y){const r2=x*x+y*y,r=Math.sqrt(r2),k=-GM/(r2*r);AX=x*k;AY=y*k;NR=r;HIT=r<.0047?99:-1;
for(const i of MP){const dx=PX[i]-x,dy=PY[i]-y,q=dx*dx+dy*dy,s=Math.sqrt(q),kk=B[i].mu/(q*s);AX+=dx*kk;AY+=dy*kk;if(s<NR)NR=s;if(s<B[i].rad)HIT=i}}
const hf=s=>Math.min(40,Math.max(.002,.03*s.nr/(Math.hypot(s.vx,s.vy)+1e-9)));
const pre=(s,h)=>{s.vx+=s.ax*h/2;s.vy+=s.ay*h/2;s.x+=s.vx*h;s.y+=s.vy*h};
const post=(s,h)=>{acc(s.x,s.y);s.ax=AX;s.ay=AY;s.nr=NR;s.hit=HIT;s.vx+=AX*h/2;s.vy+=AY*h/2};
const segmin=(ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L>0?-(ax*dx+ay*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx,ay+t*dy)};
function ls(d,ang,dv){tp(2,d);const ex=TX,ey=TY;tp(2,d+.01);const ux=Math.cos(ang),uy=Math.sin(ang);return{x:ex+ux*.005,y:ey+uy*.005,vx:(TX-ex)/.01+ux*dv*KMS,vy:(TY-ey)/.01+uy*dv*KMS}}
function sim(s0,d0,H,ti,rec){const s={...s0};setP(d0);acc(s.x,s.y);s.ax=AX;s.ay=AY;s.nr=NR;let d=d0,n=0,o={best:1e99,bd:d0,end:'',pts:rec?[s.x,s.y]:null};
while(d<d0+H&&n++<40000){const h=Math.min(hf(s),d0+H-d),ox=s.x,oy=s.y;let ax=0,ay=0;if(ti>=0){tp(ti,d);ax=TX;ay=TY}
pre(s,h);d+=h;setP(d);post(s,h);if(ti>=0){tp(ti,d);const m=segmin(ox-ax,oy-ay,s.x-TX,s.y-TY);if(m<o.best){o.best=m;o.bd=d;o.bx=s.x;o.by=s.y;o.tx=TX;o.ty=TY}}
if(rec&&n%2==0)o.pts.push(s.x,s.y);if(s.hit>=0){o.end='crash';break}}
if(rec)o.pts.push(s.x,s.y);return o}
function aimf(ti,d0,dv,H,st,c){let ba=c==null?0:c,bm=1e99;const run=(lo,hi,s)=>{for(let a=lo;a<=hi+1e-9;a+=s){const m=sim(ls(d0,a*D,dv),d0,H,ti,0).best;if(m<bm){bm=m;ba=a}}};
if(c==null)run(0,360-st,st);else bm=sim(ls(d0,c*D,dv),d0,H,ti,0).best;let w=st;for(let k=0;k<3;k++){const c0=ba;run(c0-w,c0+w,w/5);w/=5}return[(ba+360)%360,bm]}
/* ---------- game actions ---------- */
function toast(t){const d=document.createElement('div');d.textContent=t;$('ts').appendChild(d);setTimeout(()=>d.remove(),5000);while($('ts').children.length>4)$('ts').firstChild.remove()}
const dvNow=()=>RK[ty].dv*$('pw').value/100,tgi=()=>+$('tg').value,ang=()=>+$('an').value*D;
function buildUI(){$('tg').innerHTML=TI.map(i=>`<option value="${i}">${B[i].n} (${fd(B[i].a)})</option>`).join('');$('tg').value=3;rtUI()}
function rtUI(){$('rt').innerHTML=RK.map((r,i)=>{const u=S.unl[i]||S.sb;return `<div class="rk ${i==ty?'on':''}" onclick="pick(${i})"><b style="color:${r.col}">${r.n}</b> ${u?'':'🔒 '+r.unl+' cr'}<br><small>max Δv ${r.dv>1000?F(r.dv/CK*100,0)+'% c ('+F(r.dv,0)+' km/s)':r.dv+' km/s'} · launch ${r.cost} cr</small></div>`}).join('')}
function pick(i){if(!S.unl[i]&&!S.sb){const r=RK[i];if(S.cr>=r.unl){S.cr-=r.unl;S.unl[i]=1;toast('Unlocked '+r.n)}else{toast('Need '+r.unl+' credits (earn them by first flybys)');return}}ty=i;rtUI();dirty=1}
function launch(){if(!S.unl[ty]&&!S.sb)return;const c=RK[ty].cost;if(!S.sb&&S.cr<c){toast('Not enough credits');return}if(!S.sb)S.cr-=c;
const s=ls(S.d,ang(),dvNow());setP(S.d);acc(s.x,s.y);const r={id:++rid,n:'R'+rid+' '+RK[ty].n.split(' ')[0],ty,x:s.x,y:s.y,vx:s.vx,vy:s.vy,ax:AX,ay:AY,nr:NR,hit:-1,alive:1,st:'in flight',trail:[s.x,s.y],t0:S.d,seen:{},col:RK[ty].col};R.push(r);SEL={t:'r',r};toast('🚀 Launched '+r.n+' at '+F(dvNow(),dvNow()>100?0:1)+' km/s');dirty=1}
function advance(days){let rem=days,cnt=0;const xo=[],yo=[];
while(rem>1e-9&&cnt++<2500){let h=Math.min(rem,40);for(const r of R)if(r.alive)h=Math.min(h,hf(r));h=Math.max(.002,Math.min(h,rem));
for(const i of TI){tp(i,S.d);xo[i]=TX;yo[i]=TY}for(const r of R)if(r.alive){r.ox=r.x;r.oy=r.y;pre(r,h)}
S.d+=h;rem-=h;S.cr+=.02*h;setP(S.d);
for(const r of R)if(r.alive){post(r,h);const l=r.trail,lx=l[l.length-2],ly=l[l.length-1];if(Math.hypot(r.x-lx,r.y-ly)>.004*Math.max(.05,Math.hypot(r.x,r.y))){l.push(r.x,r.y);if(l.length>6000){for(let k=l.length-2;k>=0;k-=4)l.splice(k,2)}}
if(r.hit>=0){r.alive=0;r.st=r.hit==99?'burned up in the Sun':'crashed into '+B[r.hit].n;toast('💥 '+r.n+' '+r.st);continue}
for(const i of TI){if(r.seen[i]||(i==2))continue;tp(i,S.d);if(segmin(r.ox-xo[i],r.oy-yo[i],r.x-TX,r.y-TY)<B[i].thr){r.seen[i]=1;const b=B[i];if(!S.vis[b.n]){S.vis[b.n]=1;S.cr+=b.rew;toast('✅ '+r.n+' reached '+b.n+'! +'+b.rew+' credits');rtUI()}else toast('↗ '+r.n+' passed '+b.n)}}}}
if(cnt>=2500)toast('⚠ time-warp throttled to keep rockets accurate')}
function prevUpd(){if(!S.unl[ty]&&!S.sb){$('pr').innerHTML='<span class="bad">Rocket locked</span>';PV=null;return}
const ti=tgi(),r=RK[ty];PV=sim(ls(S.d,ang(),dvNow()),S.d,r.h,ti,1);const b=B[ti],ok=PV.best<b.thr;
$('pr').innerHTML=`Closest approach to <b>${b.n}</b>: <b class="${ok?'ok':'bad'}">${fd(PV.best)}</b> on ${ds(PV.bd)} (+${fy(PV.bd-S.d)})<br>${ok?'<span class="ok">✔ Flyby range ('+fd(b.thr)+')</span>':'<span class="bad">✘ Miss — flyby needs &lt; '+fd(b.thr)+'</span>'}${PV.end?'<br><span class="bad">Path ends in a crash</span>':''}`}
const run0=f=>{$('pr').textContent='Searching…';setTimeout(()=>{f();dirty=1},30)};
$('aa').onclick=()=>run0(()=>{const a=aimf(tgi(),S.d,dvNow(),RK[ty].h,2,null);$('an').value=a[0];$('av').textContent=F(a[0],2);toast('Auto-aim: best miss '+fd(a[1]))});
$('fw').onclick=()=>run0(()=>{const ti=tgi(),H=Math.min(RK[ty].h,3000),dv=dvNow();let bd=0,ba=0,bm=1e99;const st=B[ti].st?[0]:Array.from({length:41},(_,k)=>k*20);
for(const dl of st)for(let a=0;a<360;a+=10){const m=sim(ls(S.d+dl,a*D,dv),S.d+dl,H,ti,0).best;if(m<bm){bm=m;bd=dl;ba=a}}
const f=aimf(ti,S.d+bd,dv,RK[ty].h,10,ba);WIN={dl:bd,a:f[0]};$('sw').disabled=!bd;toast(bd?'Window in '+bd+' d ('+ds(S.d+bd)+'), miss '+fd(f[1]):'Launch now is best: miss '+fd(f[1]));if(!bd){$('an').value=f[0]}});
$('sw').onclick=()=>{if(!WIN)return;advance(WIN.dl);$('an').value=WIN.a;WIN=null;$('sw').disabled=1;dirty=1};
$('ln').onclick=launch;$('pw').oninput=$('an').oninput=()=>{$('pv').textContent=F(dvNow(),dvNow()>100?0:1)+' km/s';$('av').textContent=F($('an').value,2);dirty=1};$('tg').onchange=()=>dirty=1;
$('pp').onclick=()=>{run=!run;$('pp').textContent=run?'⏸':'▶'};$('wp').onchange=e=>speed=+e.target.value;$('lb').onclick=()=>labels=!labels;
$('rl').onclick=()=>{ruler=!ruler;RU=[];$('rl').style.background=ruler?'#3a63d8':''};$('sbx').onchange=e=>{S.sb=e.target.checked?1:0;rtUI()};$('sbx').checked=!!S.sb;
addEventListener('keydown',e=>{if(e.code=='Space'&&e.target.tagName!='INPUT'){e.preventDefault();$('pp').onclick()}if(e.key=='Escape'){ruler=0;RU=[];$('rl').style.background=''}});
/* ---------- camera ---------- */
const cv=$('c'),g=cv.getContext('2d');let W=800,H_=600,dp=1;
function rs(){dp=Math.min(2,devicePixelRatio||1);W=innerWidth;H_=innerHeight;cv.width=W*dp;cv.height=H_*dp}addEventListener('resize',rs);rs();
const wx=px=>(px-W/2)/cam.s+cam.x,wy=py=>(H_/2-py)/cam.s+cam.y;
function go(x,y,s){cam.fol=null;cam.tx=x;cam.ty=y;cam.ts=s}
function goStar(){const b=B[NB];go(b.x/2,b.y/2,Math.min(W,H_)*.7/b.a)}
function foll(){if(SEL)cam.fol=SEL.t=='b'?{t:'b',i:SEL.i}:{t:'r',r:SEL.r};cam.ts=Math.max(cam.s,SEL.t=='r'?200:30)}
cv.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp(-e.deltaY*.0016),ox=wx(e.offsetX),oy=wy(e.offsetY);cam.s=Math.max(1e-9,Math.min(3e6,cam.s*k));cam.ts=cam.s;if(!cam.fol){cam.x=ox-(e.offsetX-W/2)/cam.s;cam.y=oy+(e.offsetY-H_/2)/cam.s;cam.tx=cam.x;cam.ty=cam.y}},{passive:false});
let dr=null,mv=0;cv.addEventListener('pointerdown',e=>{if(e.button)return;cv.setPointerCapture(e.pointerId);dr={x:e.offsetX,y:e.offsetY,cx:cam.x,cy:cam.y};mv=0});
cv.addEventListener('pointermove',e=>{if(!dr)return;const dx=e.offsetX-dr.x,dy=e.offsetY-dr.y;mv=Math.max(mv,Math.abs(dx)+Math.abs(dy));if(mv>4){cam.fol=null;cam.x=cam.tx=dr.cx-dx/cam.s;cam.y=cam.ty=dr.cy+dy/cam.s}});
let HT=[];function hit(px,py){let b=null,bd=16;for(const h of HT){const d=Math.hypot(h.x-px,h.y-py);if(d<bd+(h.r||0)*.0&&d<bd){bd=d;b=h}}return b}
cv.addEventListener('pointerup',e=>{if(dr&&mv<=4){const h=hit(e.offsetX,e.offsetY);if(ruler){if(RU.length>=2)RU=[];RU.push(h?[h.wx,h.wy]:[wx(e.offsetX),wy(e.offsetY)])}else SEL=h?h.sel:null}dr=null});
cv.addEventListener('dblclick',e=>{const h=hit(e.offsetX,e.offsetY);if(h){SEL=h.sel;foll()}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();tp(2,S.d);const a=Math.atan2(wy(e.offsetY)-TY,wx(e.offsetX)-TX)/D;$('an').value=(a+360)%360;$('an').oninput()});
/* ---------- render ---------- */
function lab(s,x,y,c){if(!labels)return;const k=Math.round(x/90)+','+Math.round(y/13);if(LBK.has(k))return;LBK.add(k);g.fillStyle=c||'#cfe0ff';g.fillText(s,x,y)}
