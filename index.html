<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hoop Hustle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0d1a;font-family:Trebuchet MS,Segoe UI,sans-serif;color:#fff;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:min(100vw,calc(100vh*960/560));aspect-ratio:960/560}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px;box-shadow:0 0 40px #000a}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050816cc;border-radius:10px;padding:10px}
.card{background:linear-gradient(160deg,#1c2250,#10142f);border:2px solid #ff9a2e;border-radius:16px;padding:20px 26px;max-width:640px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 0 30px #ff9a2e44}
h1{margin:0 0 4px;font-size:clamp(26px,5vw,44px);color:#ff9a2e;letter-spacing:2px;text-shadow:0 3px 0 #7a3b00}
p{margin:6px 0;color:#c9d0ff;font-size:clamp(12px,1.8vw,15px)}
button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:10px;padding:10px 20px;margin:5px;color:#fff;background:#ff7a18;box-shadow:0 4px 0 #9b4500;font-size:clamp(13px,2vw,17px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #9b4500}
button.alt{background:#3b6cff;box-shadow:0 4px 0 #1f3c99}
button:disabled{background:#444;box-shadow:0 4px 0 #222;cursor:not-allowed;color:#999}
.up{display:flex;align-items:center;gap:10px;background:#ffffff0f;border-radius:10px;padding:8px 12px;margin:7px 0;text-align:left}
.up .t{flex:1}.up b{font-size:15px}.up small{display:block;color:#9fb0ff;font-size:12px}
.pips{display:flex;gap:3px;margin-top:4px}.pip{width:14px;height:6px;border-radius:3px;background:#333}.pip.on{background:#ffb23e}
.money{font-size:22px;color:#7dff8a;font-weight:bold}
</style></head><body>
<div id="wrap"><div id="box"><canvas id="c" width="960" height="560"></canvas><div id="ov"></div></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const W=960,H=560,FLOOR=500,BR=14,GRAV=0.35;
// ---------- save ----------
let S={money:0,best:0,total:0,up:{str:0,spd:0,acc:0,mul:0}};
try{const d=JSON.parse(localStorage.getItem('hoophustle1')||'null');if(d){S=Object.assign(S,d);S.up=Object.assign({str:0,spd:0,acc:0,mul:0},d.up)}}catch(e){}
function save(){try{localStorage.setItem('hoophustle1',JSON.stringify(S))}catch(e){}}
const UPG={
 str:{n:'💪 Strength',d:'More shot power — reach far, high-paying spots',base:40},
 spd:{n:'⚡ Speed',d:'Faster ball reload + more time per basket',base:35},
 acc:{n:'🎯 Accuracy',d:'Longer aim guide + wider rim',base:45},
 mul:{n:'💰 Cash Boost',d:'+25% coins per basket',base:60}};
const MAXL=10, cost=k=>Math.round(UPG[k].base*Math.pow(1.55,S.up[k]));
// ---------- audio ----------
let AC=null;function snd(f,t=.08,type='sine',v=.08,sl=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),AC.currentTime+t);gn.gain.setValueAtTime(v,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
// ---------- state ----------
let state='menu',time=0,round={score:0,earned:0,baskets:0,shots:0,streak:0,bestStreak:0};
let b={x:0,y:0,vx:0,vy:0,live:false,rim:false,board:false,t:0,rot:0,scored:false,resolved:false};
let px=300,dist=300,wind=0,wait=0,frame=0,shake=0;
let hoop={x:760,y:260,w:56,bx:0,by:0},parts=[],floats=[],aim=null,net=0;
const maxV=()=>13+S.up.str*1.25;
const rimW=()=>56+S.up.acc*3;
const stage=()=>Math.floor(round.baskets/3);
function rand(a,b){return a+Math.random()*(b-a)}
function newShot(){
 const reach=maxV()*maxV()/GRAV*0.8;
 const hi=Math.min(reach,230+stage()*45+S.up.str*10,560);
 dist=rand(190,Math.max(200,hi));
 hoop.w=rimW();
 px=hoop.bx-dist; if(px<70){px=70;dist=hoop.bx-px}
 b={x:px+16,y:FLOOR-86,vx:0,vy:0,live:false,rim:false,board:false,t:0,rot:0,scored:false,resolved:false};
 const st=stage();
 wind=st>=2?rand(-1,1)*Math.min(.05,.010+st*.006):0;
 state='ready';
}
function startRound(){
 round={score:0,earned:0,baskets:0,shots:0,streak:0,bestStreak:0};
 time=40;hoop.bx=780;hoop.by=270;hoop.w=rimW();parts=[];floats=[];
 ov.style.display='none';newShot();state='ready';
}
function endRound(){
 state='over';S.money+=0;if(round.score>S.best)S.best=round.score;S.total+=round.baskets;save();
 ov.style.display='flex';
 ov.innerHTML=`<div class="card"><h1>TIME'S UP!</h1>
 <p style="font-size:20px">Baskets: <b>${round.baskets}</b> / ${round.shots} shots</p>
 <p>Best streak: <b>${round.bestStreak}</b></p>
 <p class="money">+$${round.earned} earned</p>
 <p>Balance: $${S.money} · Best baskets in a round: ${S.best}</p>
 <button id="again">▶ Play Again</button><button class="alt" id="shop">🛒 Upgrade Shop</button></div>`;
 document.getElementById('again').onclick=startRound;document.getElementById('shop').onclick=()=>showShop('over');
}
function showMenu(){
 state='menu';ov.style.display='flex';
 ov.innerHTML=`<div class="card"><h1>🏀 HOOP HUSTLE</h1>
 <p><b>Click / touch and drag backwards</b> (like a slingshot) to aim, release to shoot.</p>
 <p>You have <b>40 seconds</b>. Every basket earns coins and adds time. Streaks multiply cash, swishes pay bonus.</p>
 <p>Watch out: the hoop starts moving and wind kicks in as you score!</p>
 <p class="money">$${S.money}</p>
 <button id="play">▶ PLAY</button><button class="alt" id="shop">🛒 Upgrade Shop</button>
 <p style="font-size:12px;opacity:.7">Lifetime baskets: ${S.total}</p></div>`;
 document.getElementById('play').onclick=startRound;document.getElementById('shop').onclick=()=>showShop('menu');
}
function showShop(from){
 let h=`<div class="card"><h1>🛒 SHOP</h1><p class="money">$${S.money}</p>`;
 for(const k in UPG){const l=S.up[k],c=cost(k),mx=l>=MAXL;
  h+=`<div class="up"><div class="t"><b>${UPG[k].n} · Lv ${l}</b><small>${UPG[k].d}</small><div class="pips">${Array.from({length:MAXL},(_,i)=>`<div class="pip ${i<l?'on':''}"></div>`).join('')}</div></div>
  <button data-k="${k}" ${mx||S.money<c?'disabled':''}>${mx?'MAX':'$'+c}</button></div>`}
 h+=`<button class="alt" id="back">⬅ Back</button></div>`;
 ov.innerHTML=h;ov.style.display='flex';
 ov.querySelectorAll('button[data-k]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k,c=cost(k);if(S.money>=c&&S.up[k]<MAXL){S.money-=c;S.up[k]++;save();snd(660,.15,'square',.06,300);showShop(from)}});
 document.getElementById('back').onclick=()=>{from==='over'?endRound2():showMenu()};
}
function endRound2(){ov.innerHTML=`<div class="card"><h1>Round Over</h1><p class="money">$${S.money}</p><button id="again">▶ Play Again</button><button class="alt" id="shop">🛒 Shop</button></div>`;
 document.getElementById('again').onclick=startRound;document.getElementById('shop').onclick=()=>showShop('over')}
// ---------- input ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{if(state!=='ready')return;cv.setPointerCapture(e.pointerId);const p=pos(e);aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y}});
cv.addEventListener('pointermove',e=>{if(!aim)return;const p=pos(e);aim.cx=p.x;aim.cy=p.y});
cv.addEventListener('pointerup',e=>{if(!aim)return;const v=aimVec();aim=null;if(v.len>18&&v.vx>0.2)shoot(v);});
function aimVec(){const dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,l=Math.hypot(dx,dy),L=Math.min(l,150),p=L/150;const sp=p*maxV();return{vx:l?dx/l*sp:0,vy:l?dy/l*sp:0,len:l,p}}
function shoot(v){b.vx=v.vx;b.vy=v.vy;b.live=true;state='fly';round.shots++;snd(300,.12,'triangle',.07,200)}
// ---------- physics ----------
function hitPt(x,y,r){const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy),m=BR+r;
 if(d<m&&d>0.001){const nx=dx/d,ny=dy/d;b.x=x+nx*m;b.y=y+ny*m;const dt=b.vx*nx+b.vy*ny;
  if(dt<0){b.vx-=1.55*dt*nx;b.vy-=1.55*dt*ny;b.rim=true;snd(180+Math.random()*60,.09,'square',.05);shake=3}}}
function resolveMiss(){if(b.resolved)return;b.resolved=true;round.streak=0;floats.push({x:Math.min(b.x,W-80),y:Math.min(b.y,FLOOR-40),t:'MISS',c:'#ff6b6b',l:50});wait=18+Math.max(0,28-S.up.spd*3);state='wait'}
function score(){
 b.scored=true;b.resolved=true;round.baskets++;round.streak++;round.bestStreak=Math.max(round.bestStreak,round.streak);
 const swish=!b.rim&&!b.board,sm=1+Math.min(round.streak-1,10)*.12;
 const pay=Math.round((8+dist/22+(swish?7:0))*sm*(1+S.up.mul*.25));
 S.money+=pay;round.earned+=pay;round.score+=pay;
 const addT=1.2+S.up.spd*.35;time=Math.min(time+addT,99);
 net=1;shake=swish?2:5;snd(swish?880:620,.25,'sine',.1,swish?500:200);
 floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-30,t:(swish?'SWISH! ':'')+'+$'+pay,c:swish?'#7dff8a':'#ffd24a',l:70});
 if(round.streak>=2)floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-62,t:'🔥 x'+round.streak,c:'#ff9a2e',l:60});
 for(let i=0;i<26;i++)parts.push({x:hoop.bx+hoop.w/2,y:hoop.by+10,vx:rand(-3,3),vy:rand(-5,1),l:rand(30,60),c:`hsl(${rand(20,60)},100%,60%)`});
 wait=22+Math.max(0,28-S.up.spd*3);state='wait';
}
function step(){
 frame++;
 // moving hoop
 const st=stage();
 if(state!=='menu'&&state!=='over'){
  const amp=st>=3?Math.min(110,25+(st-3)*18):0,ax=st>=6?Math.min(60,(st-5)*12):0;
  hoop.by=270+Math.sin(frame*.018*(1+st*.06))*amp;
  hoop.bx=780-Math.abs(Math.sin(frame*.011))*ax;
  hoop.w=rimW();
 }
 if(state==='ready'||state==='fly'||state==='wait'){time-=1/60;if(time<=0){time=0;if(state!=='fly'||true){endRound();return}}}
 if(state==='ready'){ // hold ball
  if(dist>hoop.bx-70){dist=hoop.bx-px}
 }
 if(state==='fly'||state==='wait'){
  if(b.live){
   const py=b.y;b.t++;
   b.vx+=wind;b.vy+=GRAV;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vx*.05;
   const fx=hoop.bx,bx2=hoop.bx+hoop.w;
   hitPt(fx,hoop.by,4);hitPt(bx2,hoop.by,4);
   // backboard
   const bbx=bx2+8;
   if(b.x+BR>bbx&&b.x-BR<bbx+10&&b.y>hoop.by-100&&b.y<hoop.by+14&&b.vx>0){b.x=bbx-BR;b.vx*=-.55;b.board=true;snd(140,.08,'square',.06);shake=3}
   // scoring
   if(!b.scored&&py<hoop.by&&b.y>=hoop.by&&b.vy>0&&b.x>fx+2&&b.x<bx2-2)score();
   // floor
   if(b.y+BR>FLOOR){b.y=FLOOR-BR;b.vy*=-.62;b.vx*=.92;if(Math.abs(b.vy)<1.3)b.vy=0;if(Math.abs(b.vy)>2)snd(110,.06,'sine',.07)}
   if(!b.resolved&&(b.x>W+60||b.x<-60||b.t>170||(b.y>=FLOOR-BR&&b.t>25&&Math.abs(b.vy)<2)))resolveMiss();
  }
  if(state==='wait'){wait--;if(wait<=0)newShot()}
 }
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l--}parts=parts.filter(p=>p.l>0);
 for(const f of floats){f.y-=.8;f.l--}floats=floats.filter(f=>f.l>0);
 net*=.93;shake*=.85;
}
// ---------- drawing ----------
function draw(){
 g.save();if(shake>.3)g.translate(rand(-shake,shake),rand(-shake,shake));
 const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#141a45');sk.addColorStop(.7,'#3a2a6b');sk.addColorStop(1,'#7a3b5a');g.fillStyle=sk;g.fillRect(-10,-10,W+20,H+20);
 // crowd
 for(let i=0;i<70;i++){const cx=(i*47)%W,cy=330+((i*31)%110);g.fillStyle=`hsl(${(i*37)%360},40%,${22+(i%4)*4}%)`;g.beginPath();g.arc(cx,cy,10,0,7);g.fill()}
 g.fillStyle='#ffffff10';for(let i=0;i<6;i++){g.beginPath();g.arc(120+i*150,60+(i%2)*20,3,0,7);g.fill()}
 // floor
 const fl=g.createLinearGradient(0,FLOOR,0,H);fl.addColorStop(0,'#d98b3c');fl.addColorStop(1,'#8a4d1c');g.fillStyle=fl;g.fillRect(0,FLOOR,W,H-FLOOR);
 g.strokeStyle='#ffffff55';g.lineWidth=3;g.beginPath();g.moveTo(0,FLOOR+2);g.lineTo(W,FLOOR+2);g.stroke();
 g.beginPath();g.arc(hoop.bx-40,H+40,170,Math.PI,2*Math.PI);g.stroke();
 // hoop
 const hx=hoop.bx,hy=hoop.by,w=hoop.w;
 g.fillStyle='#444';g.fillRect(hx+w+14,hy-30,6,FLOOR-hy+30);
 g.fillStyle='#e9eeff';g.strokeStyle='#9aa7d9';g.lineWidth=3;g.fillRect(hx+w+8,hy-100,12,114);g.strokeRect(hx+w+8,hy-100,12,114);
 g.strokeStyle='#ff5a1f';g.lineWidth=5;g.beginPath();g.moveTo(hx,hy);g.lineTo(hx+w,hy);g.stroke();
 g.strokeStyle='#ffffffcc';g.lineWidth=1.5;const sw=net*7;
 for(let i=0;i<=6;i++){const t=i/6;g.beginPath();g.moveTo(hx+w*t,hy);g.lineTo(hx+w*(.2+.6*t)+Math.sin(frame*.4+i)*sw,hy+42);g.stroke()}
 for(let j=1;j<4;j++){const yy=hy+j*10;g.beginPath();g.moveTo(hx+w*.05*j,yy);g.lineTo(hx+w-w*.05*j,yy);g.stroke()}
 // player
 const pxx=(state==='ready'||state==='fly'||state==='wait')?px:px;
 drawPlayer(pxx,FLOOR);
 // aim guide
 if(aim&&state==='ready'){
  const v=aimVec();let x=b.x,y=b.y,vx=v.vx,vy=v.vy;const n=7+S.up.acc*3;
  for(let i=0;i<n*4;i++){vx+=wind;vy+=GRAV;x+=vx;y+=vy;if(i%4===3){g.fillStyle=`rgba(255,255,255,${1-i/(n*4)})`;g.beginPath();g.arc(x,y,4-i/(n*4)*2,0,7);g.fill()}}
  g.fillStyle='#0008';g.fillRect(px-45,FLOOR+18,90,10);g.fillStyle=`hsl(${120-v.p*120},90%,55%)`;g.fillRect(px-45,FLOOR+18,90*v.p,10);
 }
 // ball
 if(state!=='menu'&&state!=='over'||true){drawBall(b.x,b.y,b.rot)}
 for(const p of parts){g.globalAlpha=Math.min(1,p.l/30);g.fillStyle=p.c;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;
 g.textAlign='center';g.font='bold 24px Trebuchet MS';
 for(const f of floats){g.globalAlpha=Math.min(1,f.l/25);g.fillStyle='#000a';g.fillText(f.t,f.x+2,f.y+2);g.fillStyle=f.c;g.fillText(f.t,f.x,f.y)}g.globalAlpha=1;
 g.restore();
 // HUD
 g.textAlign='left';g.font='bold 22px Trebuchet MS';g.fillStyle='#fff';
 g.fillText('⏱ '+time.toFixed(1)+'s',18,34);
 g.fillStyle='#7dff8a';g.fillText('$'+S.money,18,62);
 g.fillStyle='#ffd24a';g.fillText('🏀 '+round.baskets,18,90);
 g.textAlign='right';g.fillStyle='#ff9a2e';g.fillText(round.streak>1?'🔥 Streak x'+round.streak:'',W-18,34);
 g.fillStyle='#c9d0ff';g.font='bold 16px Trebuchet MS';
 g.fillText('Distance '+Math.round(dist/10)+' ft  ·  Level '+(stage()+1),W-18,58);
 if(Math.abs(wind)>0.001){const a=Math.min(1,Math.abs(wind)/.05);g.fillStyle='#8ff';g.fillText('Wind '+(wind>0?'→':'←').repeat(1+Math.round(a*3)),W-18,82)}
 if(state==='ready'&&!aim&&round.shots<2){g.textAlign='center';g.fillStyle='#fff';g.font='bold 20px Trebuchet MS';g.fillText('Drag back & release to shoot',W/2,H-24)}
}
function drawBall(x,y,r){g.save();g.translate(x,y);g.rotate(r);const gr=g.createRadialGradient(-4,-4,2,0,0,BR);gr.addColorStop(0,'#ffa24d');gr.addColorStop(1,'#c2500f');g.fillStyle=gr;g.beginPath();g.arc(0,0,BR,0,7);g.fill();g.strokeStyle='#3a1500';g.lineWidth=1.5;g.stroke();g.beginPath();g.moveTo(-BR,0);g.lineTo(BR,0);g.moveTo(0,-BR);g.lineTo(0,BR);g.arc(-BR*1.1,0,BR*.9,-.9,.9);g.moveTo(BR*.2,0);g.arc(BR*1.1,0,BR*.9,Math.PI-.9,Math.PI+.9);g.stroke();g.restore()}
function drawPlayer(x,y){
 let pull=0;if(aim&&state==='ready'){pull=aimVec().p}
 const shot=(state==='fly'&&b.t<14)?1-b.t/14:0;
 g.strokeStyle='#ffe0b8';g.lineWidth=7;g.lineCap='round';
 g.fillStyle='#ffe0b8';g.beginPath();g.arc(x,y-100,12,0,7);g.fill();
 g.strokeStyle='#e8412e';g.lineWidth=13;g.beginPath();g.moveTo(x,y-86);g.lineTo(x,y-44);g.stroke();
 g.strokeStyle='#ffe0b8';g.lineWidth=7;
 g.beginPath();g.moveTo(x,y-42);g.lineTo(x-12-pull*4,y);g.moveTo(x,y-42);g.lineTo(x+12+pull*4,y);g.stroke();
 const hx=x+16,hy=y-86+(1-shot)*2-shot*12;
 g.beginPath();g.moveTo(x,y-78);g.lineTo(hx-10+shot*6,hy+14-shot*16);g.lineTo(hx,hy);g.stroke();
 if(state==='ready'){b.x=x+16;b.y=FLOOR-86-pull*6}
}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){if(state!=='menu'&&state!=='over')step();else{frame++;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l--}parts=parts.filter(p=>p.l>0);}acc-=1000/60}draw();requestAnimationFrame(loop)}
// idle demo ball for menu
hoop.bx=780;hoop.by=270;b={x:300,y:FLOOR-86,vx:0,vy:0,rot:0};
showMenu();requestAnimationFrame(loop);
})();
</script></body></html>
