<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hoop Hustle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070a16;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:min(100vw,calc(100vh*960/560));aspect-ratio:960/560;max-height:100%}
canvas{width:100%;height:100%;display:block;border-radius:12px;box-shadow:0 0 50px #000c,0 0 0 1px #ffffff10}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#04070fcc;border-radius:12px;padding:12px;backdrop-filter:blur(4px)}
.card{background:linear-gradient(165deg,#1a2150 0%,#0e1230 100%);border:2px solid #ff9a2e;border-radius:18px;padding:22px 28px;max-width:620px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 0 40px #ff9a2e33,inset 0 1px 0 #ffffff15}
h1{margin:0 0 6px;font-size:clamp(28px,5.5vw,46px);color:#ff9a2e;letter-spacing:1.5px;text-shadow:0 3px 0 #7a3b00,0 0 20px #ff9a2e55}
p{margin:7px 0;color:#b8c4ff;font-size:clamp(13px,1.9vw,15.5px);line-height:1.4}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:11px 22px;margin:6px;color:#fff;background:linear-gradient(180deg,#ff8c2a,#e06a10);box-shadow:0 5px 0 #9b4500,0 6px 12px #0006;font-size:clamp(14px,2.1vw,17px);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b4500}
button.alt{background:linear-gradient(180deg,#4a7aff,#2b52d4);box-shadow:0 5px 0 #1a3488,0 6px 12px #0006}
button:disabled{background:#3a3a3a;box-shadow:0 5px 0 #222;cursor:not-allowed;color:#888}
.up{display:flex;align-items:center;gap:12px;background:#ffffff0c;border-radius:12px;padding:10px 14px;margin:8px 0;text-align:left;border:1px solid #ffffff08}
.up .t{flex:1}.up b{font-size:15px;color:#fff}.up small{display:block;color:#8ea0ff;font-size:12.5px;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:5px}.pip{width:15px;height:6px;border-radius:3px;background:#2a2a3a}.pip.on{background:linear-gradient(90deg,#ffb23e,#ff8c2a)}
.money{font-size:24px;color:#6dff8c;font-weight:800;text-shadow:0 0 12px #6dff8c44}
.hint{font-size:12.5px;opacity:.75;margin-top:10px}
</style>
</head>
<body>
<div id="wrap"><div id="box"><canvas id="c" width="960" height="560"></canvas><div id="ov"></div></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const W=960,H=560,FLOOR=500,BR=14,GRAV=0.38;
// ---------- save ----------
let S={money:0,best:0,total:0,up:{str:0,spd:0,acc:0,mul:0,run:0}};
try{const d=JSON.parse(localStorage.getItem('hoophustle2')||'null');if(d){S=Object.assign(S,d);S.up=Object.assign({str:0,spd:0,acc:0,mul:0,run:0},d.up)}}catch(e){}
function save(){try{localStorage.setItem('hoophustle2',JSON.stringify(S))}catch(e){}}
const UPG={
 str:{n:'💪 Strength',d:'More shot power — reach deep high-paying range',base:45},
 spd:{n:'⚡ Reload',d:'Faster ball return + extra time per make',base:40},
 acc:{n:'🎯 Accuracy',d:'Longer aim arc + wider rim',base:50},
 mul:{n:'💰 Cash Boost',d:'+22% coins on every basket',base:65},
 run:{n:'🏃 Hustle',d:'Move faster left/right between shots',base:35}};
const MAXL=10, cost=k=>Math.round(UPG[k].base*Math.pow(1.52,S.up[k]));
// ---------- audio ----------
let AC=null;
function snd(f,t=.08,type='sine',v=.09,sl=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),AC.currentTime+t);gn.gain.setValueAtTime(v,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
// ---------- state ----------
let state='menu',time=0,round={score:0,earned:0,baskets:0,shots:0,streak:0,bestStreak:0};
let b={x:0,y:0,vx:0,vy:0,live:false,rim:false,board:false,t:0,rot:0,scored:false,resolved:false};
let px=280,targetPx=280,wind=0,wait=0,frame=0,shake=0;
let hoop={x:760,y:260,w:56,bx:780,by:270},parts=[],floats=[],aim=null,net=0;
let keys={left:false,right:false};
const maxV=()=>12.5+S.up.str*1.35;
const rimW=()=>54+S.up.acc*3.2;
const moveSpd=()=>4.2+S.up.run*0.85;
const stage=()=>Math.floor(round.baskets/3);
function rand(a,b){return a+Math.random()*(b-a)}
function distToHoop(){return Math.max(40,hoop.bx-px)}
function payoutForDist(d){
  // Farther = much more money. Base scales with distance + stage bonus
  const ft=d/9.5;
  const base=6+ft*1.35+stage()*1.8;
  return Math.round(base);
}
function newShot(){
  b={x:px+18,y:FLOOR-88,vx:0,vy:0,live:false,rim:false,board:false,t:0,rot:0,scored:false,resolved:false};
  const st=stage();
  wind=st>=2?rand(-1,1)*Math.min(.055,.012+st*.007):0;
  state='ready';
}
function startRound(){
  round={score:0,earned:0,baskets:0,shots:0,streak:0,bestStreak:0};
  time=42;hoop.bx=780;hoop.by=270;hoop.w=rimW();parts=[];floats=[];
  px=280;targetPx=280;
  ov.style.display='none';newShot();state='ready';
}
function endRound(){
  state='over';if(round.score>S.best)S.best=round.score;S.total+=round.baskets;save();
  ov.style.display='flex';
  ov.innerHTML=`<div class="card"><h1>TIME'S UP!</h1>
  <p style="font-size:20px">Baskets: <b>${round.baskets}</b> · Shots: ${round.shots}</p>
  <p>Best streak: <b>${round.bestStreak}</b></p>
  <p class="money">+$${round.earned} earned</p>
  <p>Balance: $${S.money} · Best round score: ${S.best}</p>
  <button id="again">▶ Play Again</button><button class="alt" id="shop">🛒 Upgrade Shop</button></div>`;
  document.getElementById('again').onclick=startRound;
  document.getElementById('shop').onclick=()=>showShop('over');
}
function showMenu(){
  state='menu';ov.style.display='flex';
  ov.innerHTML=`<div class="card"><h1>🏀 HOOP HUSTLE</h1>
  <p><b>A / D or ← →</b> to run and choose your spot.<br>
  <b>Click / drag back</b> (slingshot) then release to shoot.</p>
  <p>💰 The farther you shoot from, the more cash you earn.<br>
  Streaks, swishes, and stages multiply payouts. Wind & moving rims appear later.</p>
  <p class="money">$${S.money}</p>
  <button id="play">▶ PLAY</button><button class="alt" id="shop">🛒 Upgrade Shop</button>
  <p class="hint">Lifetime baskets: ${S.total} · Best score: ${S.best}</p></div>`;
  document.getElementById('play').onclick=startRound;
  document.getElementById('shop').onclick=()=>showShop('menu');
}
function showShop(from){
  let h=`<div class="card"><h1>🛒 SHOP</h1><p class="money">$${S.money}</p>`;
  for(const k in UPG){const l=S.up[k],c=cost(k),mx=l>=MAXL;
    h+=`<div class="up"><div class="t"><b>${UPG[k].n} · Lv ${l}</b><small>${UPG[k].d}</small>
    <div class="pips">${Array.from({length:MAXL},(_,i)=>`<div class="pip ${i<l?'on':''}"></div>`).join('')}</div></div>
    <button data-k="${k}" ${mx||S.money<c?'disabled':''}>${mx?'MAX':'$'+c}</button></div>`}
  h+=`<button class="alt" id="back">⬅ Back</button></div>`;
  ov.innerHTML=h;ov.style.display='flex';
  ov.querySelectorAll('button[data-k]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k,c=cost(k);if(S.money>=c&&S.up[k]<MAXL){S.money-=c;S.up[k]++;save();snd(660,.15,'square',.06,300);showShop(from)}});
  document.getElementById('back').onclick=()=>{from==='over'?endRound2():showMenu()};
}
function endRound2(){
  ov.innerHTML=`<div class="card"><h1>Round Over</h1><p class="money">$${S.money}</p>
  <button id="again">▶ Play Again</button><button class="alt" id="shop">🛒 Shop</button></div>`;
  document.getElementById('again').onclick=startRound;
  document.getElementById('shop').onclick=()=>showShop('over');
}
// ---------- input ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
  if(state!=='ready')return;
  cv.setPointerCapture(e.pointerId);
  const p=pos(e);aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};
});
cv.addEventListener('pointermove',e=>{if(!aim)return;const p=pos(e);aim.cx=p.x;aim.cy=p.y});
cv.addEventListener('pointerup',e=>{if(!aim)return;const v=aimVec();aim=null;if(v.len>16&&v.vx>0.15)shoot(v)});
window.addEventListener('keydown',e=>{
  if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=true;
  if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=true;
});
window.addEventListener('keyup',e=>{
  if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=false;
  if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=false;
});
// touch move zones (left/right thirds of screen when not aiming)
let touchMove=null;
cv.addEventListener('pointerdown',e=>{
  if(state!=='ready'||aim)return;
  const p=pos(e);
  if(p.x<W*0.22){touchMove='left';keys.left=true}
  else if(p.x>W*0.78){touchMove='right';keys.right=true}
},{passive:true});
cv.addEventListener('pointerup',e=>{if(touchMove){keys.left=false;keys.right=false;touchMove=null}});
function aimVec(){
  const dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,l=Math.hypot(dx,dy),L=Math.min(l,155),p=L/155;
  const sp=p*maxV();
  return{vx:l?dx/l*sp:0,vy:l?dy/l*sp:0,len:l,p};
}
function shoot(v){
  b.vx=v.vx;b.vy=v.vy;b.live=true;state='fly';round.shots++;
  snd(280,.11,'triangle',.07,180);
}
// ---------- physics ----------
function hitPt(x,y,r){
  const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy),m=BR+r;
  if(d<m&&d>0.001){
    const nx=dx/d,ny=dy/d;b.x=x+nx*m;b.y=y+ny*m;
    const dt=b.vx*nx+b.vy*ny;
    if(dt<0){b.vx-=1.6*dt*nx;b.vy-=1.6*dt*ny;b.rim=true;snd(170+Math.random()*50,.08,'square',.05);shake=3.5}
  }
}
function resolveMiss(){
  if(b.resolved)return;b.resolved=true;round.streak=0;
  floats.push({x:Math.min(b.x,W-90),y:Math.min(b.y,FLOOR-50),t:'MISS',c:'#ff6b6b',l:48});
  wait=16+Math.max(0,26-S.up.spd*2.8);state='wait';
}
function score(){
  b.scored=true;b.resolved=true;round.baskets++;round.streak++;
  round.bestStreak=Math.max(round.bestStreak,round.streak);
  const d=distToHoop();
  const swish=!b.rim&&!b.board;
  const sm=1+Math.min(round.streak-1,12)*.13;
  const distPay=payoutForDist(d);
  const pay=Math.round((distPay+(swish?9:0))*sm*(1+S.up.mul*.22));
  S.money+=pay;round.earned+=pay;round.score+=pay;
  const addT=1.35+S.up.spd*.38;time=Math.min(time+addT,99);
  net=1;shake=swish?2.5:5.5;
  snd(swish?920:640,.22,'sine',.1,swish?480:180);
  const label=(swish?'SWISH! ':'')+'+$'+pay+(d>320?'  DEEP!':'');
  floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-34,t:label,c:swish?'#7dff8a':'#ffd24a',l:72});
  if(round.streak>=2)floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-66,t:'🔥 x'+round.streak,c:'#ff9a2e',l:58});
  for(let i=0;i<28;i++)parts.push({x:hoop.bx+hoop.w/2,y:hoop.by+8,vx:rand(-3.5,3.5),vy:rand(-5.5,1.2),l:rand(28,58),c:`hsl(${rand(15,55)},100%,58%)`});
  wait=20+Math.max(0,26-S.up.spd*2.8);state='wait';
}
function step(){
  frame++;
  // moving hoop
  const st=stage();
  if(state!=='menu'&&state!=='over'){
    const amp=st>=3?Math.min(115,28+(st-3)*17):0;
    const ax=st>=6?Math.min(70,(st-5)*13):0;
    hoop.by=270+Math.sin(frame*.017*(1+st*.05))*amp;
    hoop.bx=780-Math.abs(Math.sin(frame*.0105))*ax;
    hoop.w=rimW();
  }
  if(state==='ready'||state==='fly'||state==='wait'){
    time-=1/60;
    if(time<=0){time=0;endRound();return}
  }
  // player movement (only while ready)
  if(state==='ready'&&!aim){
    let spd=moveSpd();
    if(keys.left)targetPx-=spd;
    if(keys.right)targetPx+=spd;
    targetPx=Math.max(70,Math.min(hoop.bx-160,targetPx)); // can't stand under the rim
    px+=(targetPx-px)*0.22;
  }
  if(state==='fly'||state==='wait'){
    if(b.live){
      const py=b.y;b.t++;
      b.vx+=wind;b.vy+=GRAV;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vx*.05;
      const fx=hoop.bx,bx2=hoop.bx+hoop.w;
      hitPt(fx,hoop.by,4);hitPt(bx2,hoop.by,4);
      // backboard
      const bbx=bx2+8;
      if(b.x+BR>bbx&&b.x-BR<bbx+11&&b.y>hoop.by-105&&b.y<hoop.by+16&&b.vx>0){
        b.x=bbx-BR;b.vx*=-.52;b.board=true;snd(135,.07,'square',.06);shake=3;
      }
      // score
      if(!b.scored&&py<hoop.by&&b.y>=hoop.by&&b.vy>0&&b.x>fx+3&&b.x<bx2-3)score();
      // floor
      if(b.y+BR>FLOOR){
        b.y=FLOOR-BR;b.vy*=-.58;b.vx*=.9;
        if(Math.abs(b.vy)<1.2)b.vy=0;
        if(Math.abs(b.vy)>1.8)snd(105,.05,'sine',.06);
      }
      if(!b.resolved&&(b.x>W+70||b.x<-70||b.t>180||(b.y>=FLOOR-BR&&b.t>28&&Math.abs(b.vy)<1.8)))resolveMiss();
    }
    if(state==='wait'){wait--;if(wait<=0)newShot()}
  }
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.19;p.l--}parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=.85;f.l--}floats=floats.filter(f=>f.l>0);
  net*=.92;shake*=.84;
}
// ---------- drawing ----------
function draw(){
  g.save();
  if(shake>.25)g.translate(rand(-shake,shake),rand(-shake,shake));
  // sky
  const sk=g.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#0f1538');sk.addColorStop(.55,'#2a2258');sk.addColorStop(1,'#6b3550');
  g.fillStyle=sk;g.fillRect(-12,-12,W+24,H+24);
  // distant crowd
  for(let i=0;i<80;i++){
    const cx=(i*53+frame*0.15)%(W+40)-20,cy=310+((i*29)%120);
    g.fillStyle=`hsl(${(i*41)%360},38%,${20+(i%5)*3}%)`;
    g.beginPath();g.arc(cx,cy,9+i%3,0,7);g.fill();
  }
  // stars / lights
  g.fillStyle='#ffffff18';
  for(let i=0;i<8;i++){g.beginPath();g.arc(90+i*110,45+(i%3)*18,2.5,0,7);g.fill()}
  // floor
  const fl=g.createLinearGradient(0,FLOOR,0,H);
  fl.addColorStop(0,'#e09a45');fl.addColorStop(1,'#8b4e1e');
  g.fillStyle=fl;g.fillRect(0,FLOOR,W,H-FLOOR);
  g.strokeStyle='#ffffff44';g.lineWidth=3;
  g.beginPath();g.moveTo(0,FLOOR+2);g.lineTo(W,FLOOR+2);g.stroke();
  // 3pt arc style line
  g.beginPath();g.arc(hoop.bx-30,H+50,195,Math.PI*1.05,Math.PI*1.95);g.stroke();
  // court markings
  g.strokeStyle='#ffffff22';g.lineWidth=2;
  g.beginPath();g.moveTo(hoop.bx-220,FLOOR);g.lineTo(hoop.bx-220,FLOOR-8);g.stroke();
  // hoop support + backboard
  const hx=hoop.bx,hy=hoop.by,w=hoop.w;
  g.fillStyle='#333';g.fillRect(hx+w+16,hy-28,7,FLOOR-hy+28);
  g.fillStyle='#eef2ff';g.strokeStyle='#8a97c8';g.lineWidth=3;
  g.fillRect(hx+w+9,hy-108,13,120);g.strokeRect(hx+w+9,hy-108,13,120);
  // orange rim
  g.strokeStyle='#ff5a1f';g.lineWidth=5.5;
  g.beginPath();g.moveTo(hx,hy);g.lineTo(hx+w,hy);g.stroke();
  // net
  g.strokeStyle='#ffffffbb';g.lineWidth=1.4;
  const sw=net*8;
  for(let i=0;i<=7;i++){
    const t=i/7;
    g.beginPath();g.moveTo(hx+w*t,hy);
    g.lineTo(hx+w*(.18+.64*t)+Math.sin(frame*.38+i)*sw,hy+44);g.stroke();
  }
  for(let j=1;j<4;j++){
    const yy=hy+j*11;
    g.beginPath();g.moveTo(hx+w*.04*j,yy);g.lineTo(hx+w-w*.04*j,yy);g.stroke();
  }
  // player
  drawPlayer(px,FLOOR);
  // aim guide + power bar
  if(aim&&state==='ready'){
    const v=aimVec();
    let x=b.x,y=b.y,vx=v.vx,vy=v.vy;
    const n=8+S.up.acc*3.5;
    for(let i=0;i<n*4;i++){
      vx+=wind;vy+=GRAV;x+=vx;y+=vy;
      if(i%4===3){
        g.fillStyle=`rgba(255,255,255,${.95-i/(n*4)})`;
        g.beginPath();g.arc(x,y,4.2-i/(n*4)*2.2,0,7);g.fill();
      }
    }
    // power meter
    g.fillStyle='#0009';g.fillRect(px-48,FLOOR+16,96,11);
    const col=`hsl(${125-v.p*125},92%,55%)`;
    g.fillStyle=col;g.fillRect(px-48,FLOOR+16,96*v.p,11);
    g.strokeStyle='#ffffff55';g.lineWidth=1;g.strokeRect(px-48,FLOOR+16,96,11);
  }
  // ball
  if(state!=='menu')drawBall(b.x,b.y,b.rot);
  // particles
  for(const p of parts){g.globalAlpha=Math.min(1,p.l/28);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,5,5)}g.globalAlpha=1;
  // floating text
  g.textAlign='center';g.font='bold 23px Segoe UI';
  for(const f of floats){
    g.globalAlpha=Math.min(1,f.l/24);
    g.fillStyle='#000a';g.fillText(f.t,f.x+2,f.y+2);
    g.fillStyle=f.c;g.fillText(f.t,f.x,f.y);
  }
  g.globalAlpha=1;
  g.restore();
  // HUD
  g.textAlign='left';g.font='bold 21px Segoe UI';
  g.fillStyle='#fff';g.fillText('⏱ '+time.toFixed(1)+'s',16,32);
  g.fillStyle='#6dff8c';g.fillText('$'+S.money,16,58);
  g.fillStyle='#ffd24a';g.fillText('🏀 '+round.baskets,16,84);
  g.textAlign='right';
  g.fillStyle='#ff9a2e';g.fillText(round.streak>1?'🔥 x'+round.streak:'',W-16,32);
  g.fillStyle='#c4ceff';g.font='bold 15px Segoe UI';
  const d=distToHoop();
  const ft=Math.round(d/9.5);
  g.fillText(ft+' ft  ·  $'+payoutForDist(d)+' base  ·  Lvl '+(stage()+1),W-16,56);
  if(Math.abs(wind)>0.002){
    const a=Math.min(1,Math.abs(wind)/.05);
    g.fillStyle='#8ef';g.fillText('Wind '+(wind>0?'→':'←').repeat(1+Math.round(a*3)),W-16,78);
  }
  // movement hint
  if(state==='ready'&&!aim&&round.shots<3){
    g.textAlign='center';g.fillStyle='#ffffffcc';g.font='bold 17px Segoe UI';
    g.fillText('A / D or edges to move  ·  Drag back to shoot',W/2,H-22);
  }
  // distance reward indicator under player when ready
  if(state==='ready'){
    g.textAlign='center';g.font='bold 13px Segoe UI';
    g.fillStyle='#6dff8caa';
    g.fillText('+$'+payoutForDist(d),px,FLOOR+38);
  }
}
function drawBall(x,y,r){
  g.save();g.translate(x,y);g.rotate(r);
  const gr=g.createRadialGradient(-5,-5,2,0,0,BR);
  gr.addColorStop(0,'#ffb05a');gr.addColorStop(1,'#c24a0c');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,BR,0,7);g.fill();
  g.strokeStyle='#3a1600';g.lineWidth=1.6;g.stroke();
  g.beginPath();g.moveTo(-BR,0);g.lineTo(BR,0);g.moveTo(0,-BR);g.lineTo(0,BR);
  g.arc(-BR*1.05,0,BR*.88,-.85,.85);g.moveTo(BR*.15,0);g.arc(BR*1.05,0,BR*.88,Math.PI-.85,Math.PI+.85);g.stroke();
  g.restore();
}
function drawPlayer(x,y){
  let pull=0;if(aim&&state==='ready')pull=aimVec().p;
  const shot=(state==='fly'&&b.t<13)?1-b.t/13:0;
  // head
  g.fillStyle='#f0c9a0';g.beginPath();g.arc(x,y-102,13,0,7);g.fill();
  // body
  g.strokeStyle='#e33a2a';g.lineWidth=14;g.lineCap='round';
  g.beginPath();g.moveTo(x,y-88);g.lineTo(x,y-46);g.stroke();
  // legs
  g.strokeStyle='#f0c9a0';g.lineWidth=7;
  g.beginPath();
  g.moveTo(x,y-44);g.lineTo(x-13-pull*5,y);
  g.moveTo(x,y-44);g.lineTo(x+13+pull*5,y);
  g.stroke();
  // arms
  const hx=x+18,hy=y-88+(1-shot)*2-shot*14;
  g.beginPath();g.moveTo(x,y-80);g.lineTo(hx-11+shot*7,hy+15-shot*18);g.lineTo(hx,hy);g.stroke();
  // hold ball position
  if(state==='ready'){b.x=x+18;b.y=FLOOR-88-pull*7}
}
// loop
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(90,t-last);last=t;
  while(acc>=1000/60){
    if(state!=='menu'&&state!=='over')step();
    else{frame++;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.19;p.l--}parts=parts.filter(p=>p.l>0)}
    acc-=1000/60;
  }
  draw();
  requestAnimationFrame(loop);
}
// init
hoop.bx=780;hoop.by=270;
b={x:280,y:FLOOR-88,vx:0,vy:0,rot:0};
showMenu();
requestAnimationFrame(loop);
})();
</script>
