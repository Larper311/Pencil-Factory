<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Hoop Hustle · Street Legend</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04060e;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:min(100vw,calc(100vh*960/560));aspect-ratio:960/560;max-height:100%}
canvas{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 0 70px #000e,0 0 0 1px #ffffff10}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#02040bcc;border-radius:14px;padding:14px;backdrop-filter:blur(7px)}
.card{background:linear-gradient(165deg,#1a2255,#0b0f28);border:2px solid #ff9a2e;border-radius:20px;padding:24px 28px;max-width:660px;width:100%;max-height:96%;overflow:auto;text-align:center;box-shadow:0 0 55px #ff9a2e44,inset 0 1px 0 #ffffff15}
h1{margin:0 0 8px;font-size:clamp(28px,5.5vw,48px);color:#ff9a2e;letter-spacing:1.5px;text-shadow:0 3px 0 #7a3b00,0 0 22px #ff9a2e55}
p{margin:7px 0;color:#b0bcff;font-size:clamp(13px,1.85vw,15px);line-height:1.4}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:11px 22px;margin:6px;color:#fff;background:linear-gradient(180deg,#ff8f2e,#e06a10);box-shadow:0 5px 0 #9b4500,0 8px 18px #0007;font-size:clamp(13px,2vw,16px);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b4500}
button.alt{background:linear-gradient(180deg,#4a7aff,#2a52d0);box-shadow:0 5px 0 #1a3488}
button.green{background:linear-gradient(180deg,#3ddc7a,#1faa4e);box-shadow:0 5px 0 #0d6b2e}
button:disabled{background:#333;box-shadow:0 5px 0 #1a1a1a;color:#666;cursor:not-allowed}
.up{display:flex;align-items:center;gap:11px;background:#ffffff0a;border-radius:12px;padding:10px 13px;margin:7px 0;text-align:left;border:1px solid #ffffff08}
.up .t{flex:1}.up b{font-size:14.5px}.up small{display:block;color:#8ea0ff;font-size:12px;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:4px}.pip{width:13px;height:5px;border-radius:3px;background:#2a2a3a}.pip.on{background:linear-gradient(90deg,#ffb23e,#ff8c2a)}
.money{font-size:25px;color:#6dff8c;font-weight:800;text-shadow:0 0 14px #6dff8c55}
.hint{font-size:12px;opacity:.7;margin-top:10px}
.stat{display:inline-block;background:#ffffff10;border-radius:8px;padding:3px 9px;margin:2px;font-size:12.5px}
</style>
</head>
<body>
<div id="wrap"><div id="box"><canvas id="c" width="960" height="560"></canvas><div id="ov"></div></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const W=960,H=560,FLOOR=500,BR=13.5,GRAV=0.36;

// ---------- SAVE ----------
let S={money:0,best:0,total:0,games:0,dunks:0,banks:0,swishes:0,up:{str:0,spd:0,acc:0,mul:0,run:0,jump:0,luck:0}};
try{const d=JSON.parse(localStorage.getItem('hoophustle_legend')||'null');if(d){S=Object.assign(S,d);S.up=Object.assign({str:0,spd:0,acc:0,mul:0,run:0,jump:0,luck:0},d.up)}}catch(e){}
function save(){try{localStorage.setItem('hoophustle_legend',JSON.stringify(S))}catch(e){}}

const UPG={
 str:{n:'💪 Strength',d:'Deeper range & harder dunks',base:50},
 spd:{n:'⚡ Reload',d:'Faster return + more time',base:44},
 acc:{n:'🎯 Accuracy',d:'Longer guide + wider rim',base:54},
 mul:{n:'💰 Cash Boost',d:'+18% on every make',base:70},
 run:{n:'🏃 Hustle',d:'Move faster',base:40},
 jump:{n:'🦘 Bounce',d:'Higher jumps & easier dunks',base:48},
 luck:{n:'🍀 Clutch',d:'More money-balls & lucky bounces',base:58}
};
const MAXL=12,cost=k=>Math.round(UPG[k].base*Math.pow(1.47,S.up[k]));

// ---------- AUDIO ----------
let AC=null;
function snd(f,t=.08,type='sine',v=.09,sl=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext);const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),AC.currentTime+t);gn.gain.setValueAtTime(v,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
function chord(ns,t=.16){ns.forEach((n,i)=>setTimeout(()=>snd(n,t,'sine',.055),i*28))}

// ---------- STATE ----------
let state='menu',time=0,frame=0,shake=0,hitstop=0,slowmo=0,flash=0;
let round={score:0,earned:0,baskets:0,shots:0,streak:0,bestStreak:0,dunks:0,banks:0,swishes:0};
let b={x:0,y:0,vx:0,vy:0,live:false,rim:false,board:false,t:0,rot:0,scored:false,resolved:false,trail:[],spin:0};
let px=250,targetPx=250,py=0,pvy=0,facing=1,runAnim=0,jumping=false,dunking=false,dunkT=0;
let wind=0,wait=0,net=0,moneyBall=false,nextMoney=4;
let hoop={bx:780,by:268,w:56};
let parts=[],floats=[],sparks=[],aim=null;
let keys={left:false,right:false,jump:false};
let camX=0,camY=0;

const maxV=()=>12.6+S.up.str*1.25;
const rimW=()=>52+S.up.acc*2.8;
const moveSpd=()=>4.5+S.up.run*.88;
const jumpPow=()=>11.5+S.up.jump*.9;
const stage=()=>Math.floor(round.baskets/3);
const distTo=()=>Math.max(40,hoop.bx-px);

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function payout(d){
  const ft=d/9.1;
  let base=7+ft*1.6+stage()*2.2;
  if(moneyBall)base*=2.5;
  return Math.round(base);
}

// ---------- FLOW ----------
function newShot(){
  b={x:px+18,y:FLOOR-92+py,vx:0,vy:0,live:false,rim:false,board:false,t:0,rot:0,scored:false,resolved:false,trail:[],spin:0};
  const st=stage();
  wind=st>=2?rand(-1,1)*Math.min(.062,.014+st*.007):0;
  moneyBall=(round.baskets>0&&round.baskets%nextMoney===0);
  if(moneyBall)nextMoney=3+Math.floor(Math.random()*3);
  dunking=false;dunkT=0;
  state='ready';
}
function startRound(){
  round={score:0,earned:0,baskets:0,shots:0,streak:0,bestStreak:0,dunks:0,banks:0,swishes:0};
  time=45;hoop.bx=780;hoop.by=268;hoop.w=rimW();
  parts=[];floats=[];sparks=[];
  px=250;targetPx=250;py=0;pvy=0;jumping=false;
  nextMoney=4;moneyBall=false;
  ov.style.display='none';newShot();state='ready';
  snd(440,.09,'triangle',.06);
}
function endRound(){
  state='over';S.games++;
  if(round.score>S.best)S.best=round.score;
  S.total+=round.baskets;S.dunks+=round.dunks;S.banks+=round.banks;S.swishes+=round.swishes;
  save();
  ov.style.display='flex';
  ov.innerHTML=`<div class="card">
    <h1>TIME'S UP</h1>
    <p style="font-size:20px">Baskets <b>${round.baskets}</b> · Shots ${round.shots}</p>
    <p>🔥 Best streak <b>${round.bestStreak}</b></p>
    <p>🏀 Dunks ${round.dunks} · 📐 Banks ${round.banks} · ✨ Swishes ${round.swishes}</p>
    <p class="money">+$${round.earned}</p>
    <p>Balance $${S.money} · Best ${S.best}</p>
    <button id="again" class="green">▶ Play Again</button>
    <button class="alt" id="shop">🛒 Shop</button>
  </div>`;
  document.getElementById('again').onclick=startRound;
  document.getElementById('shop').onclick=()=>showShop('over');
}
function showMenu(){
  state='menu';ov.style.display='flex';
  ov.innerHTML=`<div class="card">
    <h1>🏀 HOOP HUSTLE</h1>
    <p><b>A/D</b> move · <b>Space / W</b> jump · <b>Drag</b> to shoot</p>
    <p>Get close + jump near the rim for <b>DUNKS</b>.<br>
    Bank shots, swishes, deep threes & trick shots pay extra.</p>
    <p class="money">$${S.money}</p>
    <div>
      <span class="stat">🏆 ${S.best}</span>
      <span class="stat">🏀 ${S.total}</span>
      <span class="stat">💪 ${S.dunks} dunks</span>
    </div>
    <button id="play" class="green">▶ PLAY</button>
    <button class="alt" id="shop">🛒 Shop</button>
    <p class="hint">Tip: Jump while driving for poster dunks · Banks are clutch</p>
  </div>`;
  document.getElementById('play').onclick=startRound;
  document.getElementById('shop').onclick=()=>showShop('menu');
}
function showShop(from){
  let h=`<div class="card"><h1>🛒 SHOP</h1><p class="money">$${S.money}</p>`;
  for(const k in UPG){
    const l=S.up[k],c=cost(k),mx=l>=MAXL;
    h+=`<div class="up"><div class="t"><b>${UPG[k].n} · Lv ${l}</b><small>${UPG[k].d}</small>
    <div class="pips">${Array.from({length:MAXL},(_,i)=>`<div class="pip ${i<l?'on':''}"></div>`).join('')}</div></div>
    <button data-k="${k}" ${mx||S.money<c?'disabled':''}>${mx?'MAX':'$'+c}</button></div>`;
  }
  h+=`<button class="alt" id="back">⬅ Back</button></div>`;
  ov.innerHTML=h;ov.style.display='flex';
  ov.querySelectorAll('button[data-k]').forEach(btn=>{
    btn.onclick=()=>{const k=btn.dataset.k,c=cost(k);if(S.money>=c&&S.up[k]<MAXL){S.money-=c;S.up[k]++;save();snd(700,.12,'square',.07,260);showShop(from)}};
  });
  document.getElementById('back').onclick=()=>from==='over'?endRound2():showMenu();
}
function endRound2(){
  ov.innerHTML=`<div class="card"><h1>Round Over</h1><p class="money">$${S.money}</p>
  <button id="again" class="green">▶ Again</button><button class="alt" id="shop">🛒 Shop</button></div>`;
  document.getElementById('again').onclick=startRound;
  document.getElementById('shop').onclick=()=>showShop('over');
}

// ---------- INPUT ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
  if(state!=='ready')return;
  cv.setPointerCapture(e.pointerId);
  const p=pos(e);
  if(p.x<W*.16){keys.left=true;return}
  if(p.x>W*.84){keys.right=true;return}
  if(p.y>H*.72){tryJump();return}
  aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};
});
cv.addEventListener('pointermove',e=>{if(aim){const p=pos(e);aim.cx=p.x;aim.cy=p.y}});
cv.addEventListener('pointerup',e=>{
  keys.left=keys.right=false;
  if(!aim)return;
  const v=aimVec();aim=null;
  if(v.len>13&&v.vx>0.1)shoot(v);
});
window.addEventListener('keydown',e=>{
  if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=true;
  if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=true;
  if(e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp'){e.preventDefault();tryJump()}
});
window.addEventListener('keyup',e=>{
  if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=false;
  if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=false;
});

function tryJump(){
  if(state!=='ready'||jumping||aim)return;
  jumping=true;pvy=-jumpPow();
  snd(180,.08,'sine',.06,80);
}
function aimVec(){
  const dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,l=Math.hypot(dx,dy),L=Math.min(l,158),p=L/158;
  const sp=p*maxV();
  return{vx:l?dx/l*sp:0,vy:l?dy/l*sp:0,len:l,p};
}
function shoot(v){
  // if very close and jumping high → dunk attempt
  const d=distTo();
  if(jumping&&py<-40&&d<145&&v.p>0.35){
    startDunk();
    return;
  }
  b.vx=v.vx;b.vy=v.vy;b.live=true;b.trail=[];b.spin=v.vx*0.08;
  state='fly';round.shots++;
  snd(250,.1,'triangle',.08,140);
}

function startDunk(){
  dunking=true;dunkT=0;state='dunk';
  round.shots++;
  b.live=false;
  snd(140,.12,'square',.08);
  // launch toward rim
  const targetX=hoop.bx+hoop.w*0.45;
  const targetY=hoop.by-8;
  b.x=px+10;b.y=FLOOR+py-70;
  b.vx=(targetX-b.x)/18;
  b.vy=(targetY-b.y)/18-2.5;
  b.live=true;b.t=0;
}

// ---------- PHYSICS ----------
function hitPt(x,y,r){
  const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy),m=BR+r;
  if(d<m&&d>0.001){
    const nx=dx/d,ny=dy/d;
    b.x=x+nx*m;b.y=y+ny*m;
    const dt=b.vx*nx+b.vy*ny;
    if(dt<0){
      b.vx-=1.7*dt*nx;b.vy-=1.7*dt*ny;
      b.rim=true;
      snd(155+Math.random()*45,.07,'square',.05);
      shake=4;
      for(let i=0;i<7;i++)sparks.push({x:b.x,y:b.y,vx:rand(-2.5,2.5),vy:rand(-3.5,0),l:14+rand(0,12),c:'#ffcc66'});
    }
  }
}

function resolveMiss(){
  if(b.resolved)return;
  b.resolved=true;round.streak=0;
  floats.push({x:clamp(b.x,70,W-70),y:Math.min(b.y,FLOOR-55),t:'MISS',c:'#ff5c5c',l:44,s:22});
  wait=14+Math.max(0,22-S.up.spd*2.5);
  state='wait';
  snd(85,.14,'sawtooth',.04);
}

function detectTrick(d,swish,bank,isDunk){
  const tags=[];
  let mult=1;
  if(isDunk){tags.push('DUNK');mult*=1.9;round.dunks++}
  if(bank&&!isDunk){tags.push('BANK');mult*=1.55;round.banks++}
  if(swish&&!isDunk){tags.push('SWISH');mult*=1.45;round.swishes++}
  if(d>380){tags.push('DEEP');mult*=1.25}
  if(d>460){tags.push('LOGO');mult*=1.35}
  if(moneyBall){tags.push('MONEY');mult*=1.3}
  if(round.streak>=5){tags.push('ON FIRE');mult*=1.15}
  if(b.t>90&&!isDunk){tags.push('LUCKY');mult*=1.2}
  // special
  if(swish&&d>350){tags.push('CLEAN');mult*=1.1}
  if(bank&&d>300){tags.push('GLASS');mult*=1.1}
  return{tags,mult};
}

function score(isDunk=false){
  b.scored=true;b.resolved=true;
  round.baskets++;round.streak++;
  round.bestStreak=Math.max(round.bestStreak,round.streak);
  const d=distTo();
  const swish=!b.rim&&!b.board&&!isDunk;
  const bank=b.board&&!isDunk;
  const trick=detectTrick(d,swish,bank,isDunk);
  const sm=1+Math.min(round.streak-1,15)*.13;
  let pay=Math.round(payout(d)*sm*trick.mult*(1+S.up.mul*.18));
  if(S.up.luck>0&&Math.random()<S.up.luck*.02){pay=Math.round(pay*1.6);trick.tags.push('CLUTCH')}
  S.money+=pay;round.earned+=pay;round.score+=pay;
  time=Math.min(time+1.45+S.up.spd*.35,99);
  net=isDunk?1.6:1.15;
  shake=isDunk?8: (swish?3.5:6);
  if(isDunk||swish||d>400||moneyBall){hitstop=5;slowmo=10;flash=8}
  // audio
  if(isDunk)chord([200,300,450,600],.22);
  else if(swish)chord([880,1100,1400],.18);
  else snd(600,.16,'sine',.09,200);
  // text
  const mainTag=trick.tags[0]||'MAKE';
  const label=(moneyBall?'💰 ':'')+mainTag+(trick.tags.length>1?' +':'')+'  +$'+pay;
  floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-40,t:label,c:isDunk?'#ff6bff':(swish?'#7dff8a':(bank?'#7ec8ff':'#ffd24a')),l:82,s:27});
  if(trick.tags.length>1){
    floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-72,t:trick.tags.slice(1).join(' · '),c:'#ffcc66',l:60,s:16});
  }
  if(round.streak>=2)floats.push({x:hoop.bx+hoop.w/2,y:hoop.by-98,t:'🔥 x'+round.streak,c:'#ff9a2e',l:50,s:18});
  // particles
  const cols=isDunk?['#ff6bff','#ff9a2e','#fff','#7dff8a']:moneyBall?['#ffd700','#fff','#ff9a2e']:['#ff6b2e','#ffd24a','#fff','#7dff8a'];
  for(let i=0;i<(isDunk?50:34);i++){
    parts.push({x:hoop.bx+hoop.w/2,y:hoop.by+4,vx:rand(-5.5,5.5),vy:rand(-7,2),l:rand(28,70),c:cols[i%cols.length],s:rand(3,7)});
  }
  wait=isDunk?26:18+Math.max(0,20-S.up.spd*2.4);
  state='wait';
  moneyBall=false;
  if(isDunk){jumping=false;py=0;pvy=0}
}

function step(){
  if(hitstop>0){hitstop--;return}
  const dt=slowmo>0?0.5:1;
  if(slowmo>0)slowmo--;
  if(flash>0)flash--;

  frame++;
  // hoop movement
  const st=stage();
  if(state!=='menu'&&state!=='over'){
    const amp=st>=3?Math.min(125,32+(st-3)*15):0;
    const ax=st>=6?Math.min(80,(st-5)*12):0;
    hoop.by=268+Math.sin(frame*.016*(1+st*.04))*amp;
    hoop.bx=780-Math.abs(Math.sin(frame*.0095))*ax;
    hoop.w=rimW();
  }

  if(state==='ready'||state==='fly'||state==='wait'||state==='dunk'){
    time-=(1/60)*dt;
    if(time<=0){time=0;endRound();return}
  }

  // player physics
  if(state==='ready'||state==='dunk'){
    if(!dunking){
      let spd=moveSpd();
      if(keys.left){targetPx-=spd;facing=-1}
      if(keys.right){targetPx+=spd;facing=1}
      targetPx=clamp(targetPx,65,hoop.bx-150);
      px+=(targetPx-px)*0.24;
      if(Math.abs(targetPx-px)>1.2)runAnim+=0.38;else runAnim*=0.75;
    }
    // jump
    if(jumping||dunking){
      pvy+=GRAV*1.1*dt;
      py+=pvy*dt;
      if(py>=0){py=0;pvy=0;jumping=false}
    }
  }

  if(state==='dunk'){
    dunkT++;
    if(b.live){
      b.t++;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.vy+=GRAV*0.7*dt;
      b.rot+=0.25;
      // dunk score window
      if(!b.scored&&b.y>hoop.by-25&&b.y<hoop.by+30&&b.x>hoop.bx+5&&b.x<hoop.bx+hoop.w-5){
        score(true);
      }
      if(b.t>45&&!b.scored)resolveMiss();
    }
  }

  if(state==='fly'||state==='wait'){
    if(b.live){
      const pyb=b.y;b.t++;
      b.vx+=wind*dt;b.vy+=GRAV*dt;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.rot+=b.spin;
      if(frame%2===0)b.trail.push({x:b.x,y:b.y,l:16});
      if(b.trail.length>14)b.trail.shift();
      b.trail.forEach(t=>t.l--);

      const fx=hoop.bx,bx2=hoop.bx+hoop.w;
      hitPt(fx,hoop.by,4);hitPt(bx2,hoop.by,4);
      // backboard
      const bbx=bx2+8;
      if(b.x+BR>bbx&&b.x-BR<bbx+12&&b.y>hoop.by-115&&b.y<hoop.by+20&&b.vx>0){
        b.x=bbx-BR;b.vx*=-0.48;b.board=true;
        snd(125,.07,'square',.055);shake=3.5;
        for(let i=0;i<5;i++)sparks.push({x:b.x,y:b.y,vx:rand(-1,1),vy:rand(-2,1),l:10,c:'#ccc'});
      }
      // score
      if(!b.scored&&pyb<hoop.by&&b.y>=hoop.by&&b.vy>0&&b.x>fx+3&&b.x<bx2-3)score(false);
      // floor
      if(b.y+BR>FLOOR){
        b.y=FLOOR-BR;b.vy*=-0.52;b.vx*=0.86;
        if(Math.abs(b.vy)<1.0)b.vy=0;
        if(Math.abs(b.vy)>1.5)snd(95,.05,'sine',.05);
      }
      if(!b.resolved&&(b.x>W+90||b.x<-90||b.t>200||(b.y>=FLOOR-BR&&b.t>32&&Math.abs(b.vy)<1.5)))resolveMiss();
    }
    if(state==='wait'){wait-=dt;if(wait<=0)newShot()}
  }

  // particles
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.21*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=0.95*dt;f.l-=dt}
  floats=floats.filter(f=>f.l>0);
  for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=0.16;s.l--}
  sparks=sparks.filter(s=>s.l>0);
  net*=0.90;shake*=0.82;
  camX+=((px-380)*0.07-camX)*0.09;
  camY+=((hoop.by-280)*0.05-camY)*0.07;
}

// ---------- DRAW ----------
function draw(){
  g.save();
  if(shake>0.3)g.translate(rand(-shake,shake),rand(-shake,shake));
  if(flash>0){g.fillStyle=`rgba(255,255,255,${flash*0.04})`;g.fillRect(-50,-50,W+100,H+100)}
  g.translate(-camX*0.55,-camY*0.45);

  // sky
  const sk=g.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#080c24');sk.addColorStop(.5,'#1a1545');sk.addColorStop(1,'#5a2a46');
  g.fillStyle=sk;g.fillRect(-50,-50,W+100,H+100);

  // crowd
  for(let i=0;i<95;i++){
    const cx=(i*49+frame*.11)%(W+70)-35;
    const cy=290+((i*33)%130);
    const bob=Math.sin(frame*.045+i)*2.5;
    g.fillStyle=`hsl(${(i*41)%360},42%,${17+(i%5)*3}%)`;
    g.beginPath();g.arc(cx,cy+bob,8+i%3,0,7);g.fill();
  }
  // lights
  g.fillStyle='#ffffff12';
  for(let i=0;i<8;i++){g.beginPath();g.arc(80+i*115,38+(i%2)*12,2.8,0,7);g.fill()}

  // floor
  const fl=g.createLinearGradient(0,FLOOR,0,H);
  fl.addColorStop(0,'#e8a04a');fl.addColorStop(1,'#8a4c1c');
  g.fillStyle=fl;g.fillRect(-30,FLOOR,W+60,H-FLOOR+30);
  g.fillStyle='#ffffff08';g.fillRect(-30,FLOOR,W+60,16);
  g.strokeStyle='#ffffff35';g.lineWidth=3;
  g.beginPath();g.moveTo(-30,FLOOR+2);g.lineTo(W+30,FLOOR+2);g.stroke();
  g.beginPath();g.arc(hoop.bx-35,H+60,210,Math.PI*1.07,Math.PI*1.93);g.stroke();

  // hoop structure
  const hx=hoop.bx,hy=hoop.by,w=hoop.w;
  g.fillStyle='#222';g.fillRect(hx+w+18,hy-32,8,FLOOR-hy+32);
  const bg=g.createLinearGradient(hx+w+8,hy-118,hx+w+24,hy+12);
  bg.addColorStop(0,'#f2f6ff');bg.addColorStop(1,'#c5cee8');
  g.fillStyle=bg;g.strokeStyle='#7a88b8';g.lineWidth=3;
  g.fillRect(hx+w+9,hy-114,15,128);g.strokeRect(hx+w+9,hy-114,15,128);
  g.strokeStyle='#ff5a1f77';g.lineWidth=2;g.strokeRect(hx+w-20,hy-58,30,24);

  // rim
  g.strokeStyle=moneyBall?'#ffd700':'#ff5a1f';
  g.lineWidth=6.5;g.lineCap='round';
  g.beginPath();g.moveTo(hx,hy);g.lineTo(hx+w,hy);g.stroke();
  if(moneyBall){g.strokeStyle='#ffd70044';g.lineWidth=16;g.beginPath();g.moveTo(hx-5,hy);g.lineTo(hx+w+5,hy);g.stroke()}

  // net
  g.strokeStyle='#ffffffc8';g.lineWidth=1.5;
  const sw=net*10;
  for(let i=0;i<=8;i++){
    const t=i/8;
    g.beginPath();g.moveTo(hx+w*t,hy);
    g.lineTo(hx+w*(.15+.7*t)+Math.sin(frame*.42+i)*sw,hy+48);g.stroke();
  }
  for(let j=1;j<4;j++){
    const yy=hy+j*12;
    g.beginPath();g.moveTo(hx+w*.03*j,yy);g.lineTo(hx+w-w*.03*j,yy);g.stroke();
  }

  // player
  drawPlayer(px,FLOOR+py);

  // aim
  if(aim&&state==='ready'){
    const v=aimVec();
    let x=b.x,y=b.y,vx=v.vx,vy=v.vy;
    const n=9+S.up.acc*3;
    for(let i=0;i<n*4;i++){
      vx+=wind;vy+=GRAV;x+=vx;y+=vy;
      if(i%4===3){
        g.fillStyle=`rgba(255,255,255,${0.9-i/(n*4)})`;
        g.beginPath();g.arc(x,y,4.3-i/(n*4)*2.2,0,7);g.fill();
      }
    }
    g.fillStyle='#000a';g.fillRect(px-54,FLOOR+20,108,12);
    g.fillStyle=`hsl(${130-v.p*130},95%,55%)`;
    g.fillRect(px-54,FLOOR+20,108*v.p,12);
    g.strokeStyle='#ffffff40';g.lineWidth=1;g.strokeRect(px-54,FLOOR+20,108,12);
  }

  // ball trail
  if(b.trail){
    for(const t of b.trail){
      if(t.l<=0)continue;
      g.globalAlpha=t.l/18*.55;
      g.fillStyle=moneyBall?'#ffd700':'#ff9a2e';
      g.beginPath();g.arc(t.x,t.y,5.5*(t.l/16),0,7);g.fill();
    }
    g.globalAlpha=1;
  }

  // ball
  if(state!=='menu')drawBall(b.x,b.y,b.rot);

  // particles
  for(const p of parts){
    g.globalAlpha=Math.min(1,p.l/28);
    g.fillStyle=p.c;
    g.fillRect(p.x-(p.s||4)/2,p.y-(p.s||4)/2,p.s||4,p.s||4);
  }
  g.globalAlpha=1;
  for(const s of sparks){
    g.globalAlpha=s.l/16;
    g.fillStyle=s.c;
    g.fillRect(s.x-1.5,s.y-1.5,3,3);
  }
  g.globalAlpha=1;

  // floats
  g.textAlign='center';
  for(const f of floats){
    g.globalAlpha=Math.min(1,f.l/20);
    g.font=`bold ${f.s||22}px Segoe UI`;
    g.fillStyle='#000a';g.fillText(f.t,f.x+2,f.y+2);
    g.fillStyle=f.c;g.fillText(f.t,f.x,f.y);
  }
  g.globalAlpha=1;
  g.restore();

  // HUD
  g.textAlign='left';g.font='bold 19px Segoe UI';
  g.fillStyle='#fff';g.fillText('⏱ '+time.toFixed(1)+'s',15,28);
  g.fillStyle='#6dff8c';g.fillText('$'+S.money,15,52);
  g.fillStyle='#ffd24a';g.fillText('🏀 '+round.baskets,15,76);

  g.textAlign='right';
  if(round.streak>1){g.fillStyle='#ff9a2e';g.font='bold 19px Segoe UI';g.fillText('🔥 x'+round.streak,W-15,28)}
  g.fillStyle='#c4ceff';g.font='bold 13px Segoe UI';
  const d=distTo(),ft=Math.round(d/9.1);
  g.fillText(ft+' ft  ·  $'+payout(d)+'  ·  Lvl '+(stage()+1),W-15,52);
  if(Math.abs(wind)>0.003){
    const a=Math.min(1,Math.abs(wind)/.055);
    g.fillStyle='#8ef';g.fillText('Wind '+(wind>0?'→':'←').repeat(1+Math.round(a*3)),W-15,72);
  }
  if(moneyBall){g.fillStyle='#ffd700';g.font='bold 15px Segoe UI';g.fillText('💰 MONEY BALL',W-15,94)}

  if(state==='ready'&&!aim&&round.shots<2){
    g.textAlign='center';g.fillStyle='#ffffffb0';g.font='bold 15px Segoe UI';
    g.fillText('A/D move · SPACE jump · Drag to shoot · Close + jump = DUNK',W/2,H-18);
  }
  if(state==='ready'){
    g.textAlign='center';g.font='bold 12px Segoe UI';
    g.fillStyle=moneyBall?'#ffd700':'#6dff8caa';
    g.fillText((moneyBall?'💰 ':'')+'+$'+payout(d),px-camX*.55,FLOOR+42+py);
  }
}

function drawBall(x,y,r){
  g.save();g.translate(x,y);g.rotate(r);
  if(moneyBall){g.fillStyle='#ffd70033';g.beginPath();g.arc(0,0,BR+9,0,7);g.fill()}
  const gr=g.createRadialGradient(-5,-5,2,0,0,BR);
  gr.addColorStop(0,moneyBall?'#ffe066':'#ffb25c');
  gr.addColorStop(1,moneyBall?'#c9a000':'#c24a0c');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,BR,0,7);g.fill();
  g.strokeStyle='#3a1600';g.lineWidth=1.5;g.stroke();
  g.beginPath();g.moveTo(-BR,0);g.lineTo(BR,0);g.moveTo(0,-BR);g.lineTo(0,BR);
  g.arc(-BR*1.05,0,BR*.88,-.85,.85);
  g.moveTo(BR*.15,0);g.arc(BR*1.05,0,BR*.88,Math.PI-.85,Math.PI+.85);g.stroke();
  g.restore();
}

function drawPlayer(x,y){
  let pull=0;
  if(aim&&state==='ready')pull=aimVec().p;
  const shot=(state==='fly'&&b.t<11)?1-b.t/11:0;
  const dunkPose=dunking?Math.min(1,dunkT/12):0;
  const legSwing=Math.sin(runAnim)*12*(Math.abs(targetPx-px)>1.5&&!jumping?1:0);
  const bodyY=y- (dunkPose*25);

  // shadow
  g.fillStyle='#0005';
  g.beginPath();g.ellipse(x,FLOOR+2,16-py*0.08,4.5,0,0,7);g.fill();

  // head
  g.fillStyle='#f0c9a0';
  g.beginPath();g.arc(x,bodyY-106,13,0,7);g.fill();

  // body
  g.strokeStyle='#e33a2a';g.lineWidth=15;g.lineCap='round';
  g.beginPath();g.moveTo(x,bodyY-92);g.lineTo(x,bodyY-50);g.stroke();

  // legs
  g.strokeStyle='#f0c9a0';g.lineWidth=7;
  if(dunking){
    g.beginPath();
    g.moveTo(x,bodyY-48);g.lineTo(x-18,bodyY-10);
    g.moveTo(x,bodyY-48);g.lineTo(x+14,bodyY+5);
    g.stroke();
  }else{
    g.beginPath();
    g.moveTo(x,bodyY-48);g.lineTo(x-12-pull*4+legSwing,y);
    g.moveTo(x,bodyY-48);g.lineTo(x+12+pull*4-legSwing,y);
    g.stroke();
  }

  // arms
  g.strokeStyle='#f0c9a0';g.lineWidth=7;
  if(dunking){
    g.beginPath();
    g.moveTo(x,bodyY-84);
    g.lineTo(x+22,bodyY-110);
    g.lineTo(x+28,bodyY-95);
    g.stroke();
  }else{
    const hx=x+17*facing,hy=bodyY-92+(1-shot)*2-shot*14-pull*6;
    g.beginPath();
    g.moveTo(x,bodyY-84);
    g.lineTo(hx-10*facing+shot*6*facing,hy+12-shot*14);
    g.lineTo(hx,hy);
    g.stroke();
  }

  // hold ball
  if(state==='ready'&&!dunking){
    b.x=x+17;b.y=bodyY-92-pull*9;
  }
}

// ---------- LOOP ----------
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(80,t-last);last=t;
  while(acc>=1000/60){
    if(state!=='menu'&&state!=='over')step();
    else{frame++;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.21;p.l--}parts=parts.filter(p=>p.l>0)}
    acc-=1000/60;
  }
  draw();
  requestAnimationFrame(loop);
}

// boot
hoop.bx=780;hoop.by=268;
b={x:250,y:FLOOR-92,vx:0,vy:0,rot:0,trail:[]};
showMenu();
requestAnimationFrame(loop);
})();
</script>
